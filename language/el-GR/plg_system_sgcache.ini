; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Ενεργοποίηση Δυναμικής Cache"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Ενεργοποίηση κεφαλίδων δυναμικής cache της SiteGround. Οι σελίδες θα επισημαίνονται ως αποθηκεύσιμες στην cache για τον reverse proxy της SiteGround."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Αυτόματη Εκκαθάριση κατά την Αλλαγή Περιεχομένου"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Αυτόματη εκκαθάριση σχετικών καταχωρήσεων cache όταν αποθηκεύεται, διαγράφεται ή αλλάζει κατάσταση το περιεχόμενο."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Όριο Εκκαθάρισης"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Αν χρειάζεται εκκαθάριση περισσότερων URL από αυτόν τον αριθμό, θα εκτελεστεί πλήρης εκκαθάριση cache αντί για μεμονωμένη εκκαθάριση. Προεπιλογή: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="Εξαιρούμενα URL"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="Μία διαδρομή URL ανά γραμμή (σχετική με τη ρίζα του ιστότοπου) που δεν πρέπει ποτέ να αποθηκεύεται στην cache. Μια απλή διαδρομή καλύπτει επίσης ό,τι ξεκινά με αυτήν: η <code>/members</code> καλύπτει την <code>/members/profile</code>. Χρησιμοποιήστε <code>*</code> για οποιοδήποτε κείμενο (<code>/shop/*/checkout</code>), τελειώστε μια γραμμή με <code>$</code> για να ταιριάζει μόνο αυτή η διαδρομή (<code>/about$</code>) και συμπεριλάβετε <code>?</code> για να ελέγχεται και το query string (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Εξαιρούμενα Στοιχεία Μενού"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Οι σελίδες που εμφανίζονται κάτω από αυτά τα στοιχεία μενού δεν αποθηκεύονται ποτέ στην cache. Πιο εύκολο από το να μαντεύετε διαδρομές URL. Το Joomla χρησιμοποιεί επίσης ένα στοιχείο μενού για σελίδες στις οποίες φτάνετε μέσω αυτού, όπως τα άρθρα ενός blog κατηγορίας."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Αποθηκεύσιμες Παράμετροι Ερωτήματος"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Οι σελίδες με query string δεν αποθηκεύονται στην cache, εκτός από τις παραμέτρους παρακολούθησης μάρκετινγκ (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), που δεν αλλάζουν τη σελίδα. Καταχωρίστε εδώ άλλες παραμέτρους, μία ανά γραμμή, ώστε να αποθηκεύονται και αυτές οι σελίδες στην cache, για παράδειγμα <code>start</code> ή <code>limitstart</code> για τη σελιδοποίηση. Οι <code>format</code>, <code>tmpl</code> και <code>task</code> δεν αποθηκεύονται ποτέ στην cache, ούτε μια σελίδα της οποίας το URL συνδυάζει μια καταχωρισμένη παράμετρο με μια παράμετρο παρακολούθησης: η SiteGround θα την αποθήκευε με τη σκέτη διαδρομή."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="Εξαιρούμενοι User Agents"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="Ένα κείμενο ανά γραμμή, για παράδειγμα <code>Feedly</code> ή <code>UptimeRobot</code>. Όταν ο user agent ενός επισκέπτη το περιέχει (χωρίς διάκριση πεζών-κεφαλαίων), η σελίδα που δημιουργείται γι' αυτόν δεν αποθηκεύεται στην cache. Σημείωση: η SiteGround μπορεί και πάλι να του απαντήσει με αντίγραφο αποθηκευμένο για κάποιον άλλον, εκτός αν είναι ενεργή η επιλογή <em>Διαφοροποίηση ανά User Agent</em> (καρτέλα Ρυθμίσεις για Προχωρημένους)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Σελίδες με φόρμες"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Μια φόρμα Joomla περιέχει ένα διακριτικό ασφαλείας που ανήκει στη συνεδρία του επισκέπτη, οπότε ένα αντίγραφο στην cache δεν μπορεί απλώς να μοιραστεί. Με ενεργή την επιλογή <em>Αποθήκευση στην Cache Σελίδων με Φόρμες</em>, το plugin αποθηκεύει τη σελίδα στην cache χωρίς το διακριτικό και ο browser του επισκέπτη λαμβάνει το δικό του διακριτικό την πρώτη φορά που χρησιμοποιεί τη φόρμα. Οι φόρμες που δεν είναι επιλεγμένες παρακάτω, καθώς και όσες δεν αναγνωρίζει το plugin, αφήνουν τη σελίδα τους εκτός cache όπως πριν."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Αποθήκευση στην Cache Σελίδων με Φόρμες"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Αποθήκευση στην cache σελίδων των οποίων οι μόνες φόρμες είναι των τύπων που έχουν επιλεγεί παρακάτω, με το διακριτικό κάθε επισκέπτη να λαμβάνεται μέσω script. Απαιτεί JavaScript στον browser του επισκέπτη (το Convert Forms το χρειάζεται έτσι κι αλλιώς). Μετά την ενεργοποίηση, υποβάλετε κάθε φόρμα μία φορά σε ιδιωτικό παράθυρο για να την ελέγξετε. Απενεργοποιήστε το για να μένει κάθε σελίδα με φόρμα εκτός cache."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Φόρμες που Μπορούν να Αποθηκευτούν στην Cache"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Τύποι φορμών που είναι γνωστό ότι δεν χρειάζονται τίποτα από τη συνεδρία του επισκέπτη εκτός από το διακριτικό."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Ένθεμα σύνδεσης Joomla"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Άλλες Φόρμες (δείκτες)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="Για άλλες φόρμες που χρειάζονται μόνο το διακριτικό: ένα κείμενο ανά γραμμή που εμφανίζεται μέσα στο HTML της φόρμας, όπως <code>id=&quot;newsletter&quot;</code>. Προσθέστε μια φόρμα εδώ μόνο αφού ελέγξετε ότι δεν κρατά τίποτα άλλο στη συνεδρία του επισκέπτη (απάντηση captcha, καλάθι, κατάσταση πολλαπλών βημάτων)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Εξαιρούμενα Components"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Επιλέξτε components των οποίων οι σελίδες δεν πρέπει ποτέ να αποθηκεύονται στην cache από τη SiteGround."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Εμφάνιση Κουμπιού Εκκαθάρισης στη Διαχείριση"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Εμφάνιση κουμπιού 'Εκκαθάριση Cache SiteGround' στην επάνω γραμμή της περιοχής διαχείρισης Joomla, ορατό σε κάθε σελίδα. Εκκαθαρίζει μόνο την cache διακομιστή της SiteGround. Η λειτουργία του Joomla Σύστημα &rarr; Εκκαθάριση Cache και τα κουμπιά εκκαθάρισης cache βελτιστοποιητών όπως το JCH Optimize δεν αγγίζουν την cache της SiteGround, και αυτό το κουμπί δεν αγγίζει τη δική τους."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Λειτουργία Κουμπιού"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Απλό: ένα κουμπί που εκκαθαρίζει όλη την cache. Αναπτυσσόμενο: διαιρεμένο κουμπί με 'Εκκαθάριση Όλων' και επιλογές προσαρμοσμένων διαδρομών."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Απλό - Εκκαθάριση Όλων"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Αναπτυσσόμενο - Εκκαθάριση Όλων + Προσαρμοσμένες Διαδρομές"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Προσαρμοσμένες Διαδρομές Εκκαθάρισης"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="Μία καταχώρηση ανά γραμμή στη μορφή: Ετικέτα|/διαδρομή. Αυτές εμφανίζονται ως επιλογές στο αναπτυσσόμενο μενού. Παράδειγμα: Blog|/blog ή News Section|/news"

; Toolbar button labels
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE="Εκκαθάριση Cache SiteGround"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_TITLE="Εκκαθαρίζει την cache διακομιστή της SiteGround (όχι την cache του ίδιου του Joomla)"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_ALL="Εκκαθάριση Όλης της Cache"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_LABEL="Εκκαθάριση Συγκεκριμένης Διαδρομής"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGING="Εκκαθάριση..."

; Logging & debug settings
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING="Ενεργοποίηση Καταγραφής σε Αρχείο"
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING_DESC="Καταγραφή λειτουργιών cache σε αρχείο καταγραφής στον κατάλογο logs του Joomla. Χρήσιμο για αντιμετώπιση προβλημάτων. Απενεργοποιήστε σε παραγωγή για βέλτιστη απόδοση."
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING="Αναλυτική Λειτουργία"
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING_DESC="Καταγραφή κάθε επίσκεψης σελίδας frontend, συμπεριλαμβανομένων των απαντήσεων με ενεργοποιημένη cache. Όταν είναι απενεργοποιημένο, καταγράφονται μόνο οι παρακάμψεις cache, οι εκκαθαρίσεις, τα σφάλματα και οι αλλαγές περιεχομένου. Ενεργοποιήστε προσωρινά για αντιμετώπιση προβλημάτων, στη συνέχεια απενεργοποιήστε για παραγωγή."
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG="Ενεργοποίηση Πάνελ Αποσφαλμάτωσης"
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG_DESC="Εμφάνιση πάνελ αποσφαλμάτωσης στο κάτω μέρος κάθε σελίδας διαχείρισης που εμφανίζει τις λειτουργίες cache που πραγματοποιήθηκαν κατά το τρέχον αίτημα. Ορατό μόνο σε διαχειριστές."
PLG_SYSTEM_SGCACHE_LOG_FILE="Όνομα Αρχείου Καταγραφής"
PLG_SYSTEM_SGCACHE_LOG_FILE_DESC="Όνομα του αρχείου καταγραφής. Αποθηκεύεται με αυτό το όνομα συν .php στον φάκελο καταγραφής του Joomla (Γενικές Ρυθμίσεις &rarr; Σύστημα &rarr; Διαδρομή Φακέλου Καταγραφής) και ξεκινά με μια γραμμή που εμποδίζει τον browser να το διαβάσει. Προεπιλογή: sgcache.log"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE="Μέγιστο Μέγεθος Αρχείου Καταγραφής (MB)"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE_DESC="Όταν το αρχείο καταγραφής υπερβεί αυτό το μέγεθος, θα γίνει εναλλαγή. Διατηρούνται τα τελευταία 5 αρχεία εναλλαγής. Προεπιλογή: 5 MB."
PLG_SYSTEM_SGCACHE_LOG_VIEWER="Προβολή Αρχείου Καταγραφής"
PLG_SYSTEM_SGCACHE_LOG_VIEWER_DESC="Προβολή, λήψη, δοκιμή ή εκκαθάριση του αρχείου καταγραφής cache."

