; Home page watchdog (System > Scheduled Tasks)
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE_LABEL="Φύλακας αρχικής σελίδας"
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE="Μια προγραμματισμένη εργασία μπορεί να λαμβάνει την αρχική σας σελίδα κάθε λίγα λεπτά και, αν ποτέ επιστρέψει κάτι άλλο από ιστοσελίδα, να εκκαθαρίζει την cache της SiteGround και να σας στέλνει email. Ο εγκαταστάτης την προσθέτει μη δημοσιευμένη: μεταβείτε στο <a href='index.php?option=com_scheduler&amp;view=tasks'>Σύστημα &rarr; Προγραμματισμένες Εργασίες</a>, ανοίξτε το <em>SiteGround Cache: φύλακας αρχικής σελίδας</em> και δημοσιεύστε το."
