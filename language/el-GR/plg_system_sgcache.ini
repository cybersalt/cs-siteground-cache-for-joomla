; Session-handling group note in Advanced tab
PLG_SYSTEM_SGCACHE_SESSION_HANDLING_NOTE="<strong>Διαχείριση συνεδριών.</strong> Αυτές οι δύο ρυθμίσεις καθορίζουν αν η SiteGround μπορεί πραγματικά να αποθηκεύει στην cache την ανώνυμη κίνηση. Οι προεπιλογές (<em>Cache για Συνδεδεμένους Χρήστες: Όχι</em>, <em>Αποτροπή Cookie Συνεδρίας: Ναι</em>) είναι σωστές για σχεδόν κάθε ιστότοπο."

