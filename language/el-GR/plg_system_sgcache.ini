; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Καλώς ήρθατε στο Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="Ένα plugin συστήματος για Joomla 5 / 6 που ενσωματώνεται με τη δυναμική cache διακομιστή της SiteGround. Ταχύτερη φόρτωση σελίδων, αυτόματη εκκαθάριση cache όταν αλλάζει το περιεχόμενο και οι σωστές κεφαλίδες HTTP ώστε ο edge της SiteGround να αποθηκεύει πραγματικά τις σελίδες σας στην cache."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Γρήγορη Έναρξη"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Επιβεβαιώστε ότι η SiteGround εντοπίστηκε.</strong> Ανοίξτε την καρτέλα <em>Ρυθμίσεις Cache</em> και δείτε τον πίνακα κατάστασης στην κορυφή. Το πλακίδιο Φιλοξενία SiteGround πρέπει να γράφει 'Εντοπίστηκε'. Αν όχι, αυτό το plugin δεν θα κάνει τίποτα &mdash; λειτουργεί μόνο σε διακομιστές SiteGround."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Αφήστε τις προεπιλογές ως έχουν.</strong> Η δυναμική cache, η αυτόματη εκκαθάριση και η αποτροπή cookie συνεδρίας είναι όλες ΕΝΕΡΓΕΣ από προεπιλογή. Αυτή είναι η σωστή ρύθμιση για σχεδόν κάθε ιστότοπο."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Επαληθεύστε ότι λειτουργεί.</strong> Ανοίξτε τον ιστότοπό σας σε ιδιωτικό παράθυρο/παράθυρο ανώνυμης περιήγησης και ελέγξτε τις κεφαλίδες απάντησης. Θα πρέπει να βλέπετε <code>X-Cache-Enabled: True</code> και <em>καθόλου</em> <code>Set-Cookie</code>. Ελέγξτε ξανά μετά από ένα λεπτό &mdash; το <code>X-Proxy-Cache: HIT</code> σημαίνει ότι η SiteGround εξυπηρετεί πλέον από την cache."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Δείτε την αναλογία cache να ανεβαίνει.</strong> Επισκεφθείτε τον πίνακα ελέγχου της SiteGround και παρακολουθήστε την αναλογία cache να βελτιώνεται τις επόμενες 24&ndash;48 ώρες, καθώς ο edge γεμίζει με αποθηκευμένες σελίδες."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Συμβουλές"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Οι σελίδες με Convert Forms, RSForm! Pro ή το ένθεμα σύνδεσης αποθηκεύονται στην cache χωρίς το διακριτικό ασφαλείας της φόρμας· ο browser κάθε επισκέπτη λαμβάνει το δικό του όταν χρησιμοποιεί τη φόρμα. Οι σελίδες με οποιαδήποτε άλλη φόρμα Joomla εντοπίζονται και μένουν εκτός cache, ώστε οι φόρμες τους να συνεχίζουν να λειτουργούν. Κάντε κλικ στο <em>Δοκιμή της αρχικής μου σελίδας</em> στην καρτέλα Ρυθμίσεις Cache για να δείτε αν οι σελίδες σας αποθηκεύονται στην cache και, αν όχι, γιατί. Χρησιμοποιήστε τα <em>Εξαιρούμενα URL</em> ή <em>Εξαιρούμενα Στοιχεία Μενού</em> μόνο για άλλες σελίδες που δεν πρέπει ποτέ να αποθηκεύονται στην cache, όπως σελίδες που δείχνουν διαφορετικό περιεχόμενο σε κάθε επισκέπτη."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Χρησιμοποιήστε το κουμπί <em>Εκκαθάριση Cache SiteGround</em> στην επάνω γραμμή της διαχείρισης Joomla (ενεργό από προεπιλογή) για πλήρη εκκαθάριση της cache με ένα κλικ κάθε φορά που κάνετε μια μεγάλη αλλαγή περιεχομένου. Εκκαθαρίζει μόνο την cache της SiteGround· η Εκκαθάριση Cache του ίδιου του Joomla δεν το κάνει."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Ενεργοποιήστε την καταγραφή στην καρτέλα Καταγραφή αν αντιμετωπίζετε κάποιο πρόβλημα. Ο ενσωματωμένος πίνακας δείχνει κάθε απόφαση cache σε πραγματικό χρόνο. Απενεργοποιήστε την σε παραγωγή για να λειτουργούν όλα γρήγορα."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="Σχετικά με αυτό το plugin"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Το Cybersalt SiteGround Cache είναι μια δωρεάν επέκταση ανοιχτού κώδικα για Joomla 5 / 6, που δημιουργείται και συντηρείται από την Cybersalt. Καλύπτει το κενό στην προσωρινή αποθήκευση της SiteGround που άφηνε κάθε ιστότοπο Joomla στη SiteGround να λειτουργεί χωρίς cache &mdash; μέχρι τώρα."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Πόροι"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="Περισσότερες επεκτάσεις Joomla από την Cybersalt"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="Πηγαίος κώδικας στο GitHub"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Αναφορά σφάλματος / Αίτημα λειτουργίας"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Υποστήριξη &amp; αναφορές σφαλμάτων"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="Αν βρείτε κάποιο σφάλμα ή έχετε αίτημα για νέα λειτουργία, ανοίξτε ένα issue στο GitHub ή επικοινωνήστε απευθείας με την Cybersalt. Απαντάμε σε κάθε αναφορά &mdash; αυτό το plugin συντηρείται ενεργά σε ιστότοπους παραγωγής που διαχειριζόμαστε."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Αναφορά προέλευσης"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="Το πρωτόκολλο επικοινωνίας cache της SiteGround (API μέσω UNIX socket για εκκαθάριση cache) έγινε γνωστό μελετώντας το plugin Speed Optimizer της SiteGround για WordPress (GPLv3). Δεν αντιγράφηκε κώδικας WordPress· πρόκειται για ανεξάρτητη υλοποίηση Joomla γραμμένη από την αρχή με το εγγενές API plugins του Joomla 5. Δεν σχετίζεται ούτε υποστηρίζεται από τη SiteGround."
PLG_SYSTEM_SGCACHE_ABOUT_LICENSE="Copyright (C) 2026 Cybersalt. Διατίθεται υπό την άδεια GNU General Public License v2 ή νεότερη."
