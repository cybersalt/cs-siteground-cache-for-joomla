PLG_SYSTEM_SGCACHE="System - SiteGround Cache"
PLG_SYSTEM_SGCACHE_DESCRIPTION="将Joomla与SiteGround的服务器端cache系统集成。当内容更改时自动清除动态cache并设置适当的cache头。<br/><br/><small>Cache通信协议从SiteGround的WordPress <a href='https://wordpress.org/plugins/sg-cachepress/'>Speed Optimizer</a>插件（GPLv3）中学习。未复制任何代码；这是一个独立的Joomla实现。与SiteGround无关联或认可关系。</small>"

