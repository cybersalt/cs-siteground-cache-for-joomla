; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="启用动态cache"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="启用SiteGround动态cache头。页面将被标记为SiteGround反向代理可缓存。"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="内容更改时自动清除"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="当内容被保存、删除或状态更改时，自动清除相关的cache条目。"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="清除阈值"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="如果需要清除的URL数量超过此值，将执行全部cache刷新而不是单独清除。默认值：10。"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="排除的URL"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="每行输入一个永远不应被缓存的URL路径（相对于站点根目录）。普通路径也涵盖所有以它开头的路径：<code>/members</code> 涵盖 <code>/members/profile</code>。用 <code>*</code> 匹配任意文本（<code>/shop/*/checkout</code>），在行尾加 <code>$</code> 只匹配该路径本身（<code>/about$</code>），包含 <code>?</code> 则同时匹配查询字符串（<code>/search?q=</code>）。"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="排除的菜单项"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="这些菜单项下显示的页面永远不会被缓存。比猜测URL路径更容易。对于通过某个菜单项访问到的页面（例如分类博客中的文章），Joomla也会使用该菜单项。"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="可缓存的查询参数"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="带有查询字符串的页面不会被缓存，但营销跟踪参数（<code>utm_*</code>、<code>fbclid</code>、<code>gclid</code>...）除外，因为它们不会改变页面。在此每行列出一个其他参数，可让这些页面也被缓存，例如用于分页的 <code>start</code> 或 <code>limitstart</code>。<code>format</code>、<code>tmpl</code> 和 <code>task</code> 永远不会被缓存；URL中同时含有已列出参数和跟踪参数的页面也不会被缓存：SiteGround会把它存储在不带参数的路径下。"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="排除的用户代理"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="每行一段文本，例如 <code>Feedly</code> 或 <code>UptimeRobot</code>。当访客的用户代理包含该文本时（不区分大小写），为其生成的页面不会存入cache。注意：除非开启了 <em>按用户代理区分</em>（高级设置选项卡），否则SiteGround仍可能用为其他人缓存的副本响应他们。"
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="含表单的页面"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Joomla表单带有属于访客会话的安全令牌，因此缓存的副本不能直接共享。开启 <em>缓存含表单的页面</em> 后，插件会缓存不含令牌的页面，访客的浏览器在首次使用表单时获取自己的令牌。下方未勾选的表单以及插件无法识别的表单，其页面仍和以前一样不被缓存。"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="缓存含表单的页面"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="缓存只包含下方已勾选类型表单的页面，每位访客的令牌通过脚本获取。需要访客的浏览器支持JavaScript（Convert Forms本来就需要）。开启后，请在隐私窗口中将每个表单各提交一次进行检查。关闭则所有含表单的页面都不被缓存。"
PLG_SYSTEM_SGCACHE_FORM_TYPES="可缓存的表单"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="已知除令牌外不需要访客会话中任何内容的表单类型。"
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Joomla登录模块"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="其他表单（标记）"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="用于其他只需要令牌的表单：每行一段出现在表单HTML中的文本，例如 <code>id=&quot;newsletter&quot;</code>。只有在确认该表单不会在访客会话中保存其他内容（验证码答案、购物车、多步骤状态）之后，才可在此添加。"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="排除的组件"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="选择不应被SiteGround缓存的组件。"

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="在管理后台显示清除按钮"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="在Joomla管理区域的顶部栏显示「清除SiteGround cache」按钮，在每个页面上可见。它只清除SiteGround的服务器cache。Joomla自带的 系统 &rarr; 清除缓存，以及JCH Optimize等优化工具的清除缓存按钮，都不会影响SiteGround的cache，此按钮也不会影响它们的缓存。"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="按钮模式"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="简单：一个清除所有cache的按钮。下拉：带有「清除全部」和自定义路径选项的分割按钮。"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="简单 - 清除全部"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="下拉 - 清除全部 + 自定义路径"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="自定义清除路径"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="每行一个条目，格式为：标签|/路径。这些将作为下拉选项显示。例如：博客|/blog 或 新闻版块|/news"

