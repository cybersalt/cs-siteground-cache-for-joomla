; Logging & debug settings
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING="启用文件日志"
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING_DESC="将cache操作写入Joomla日志目录中的日志文件。适用于故障排除。在生产环境中禁用以获得最佳性能。"
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING="详细模式"
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING_DESC="记录每次前端页面访问，包括启用cache的响应。关闭时，仅记录cache绕过、清除、错误和内容更改。临时开启用于故障排除，然后在生产环境中关闭。"
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG="启用调试面板"
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG_DESC="在每个管理页面底部显示调试面板，显示当前请求期间发生的cache操作。仅对管理员可见。"
PLG_SYSTEM_SGCACHE_LOG_FILE="日志文件名"
PLG_SYSTEM_SGCACHE_LOG_FILE_DESC="日志文件的名称。它以此名称加 .php 的形式保存在Joomla的日志文件夹中（全局配置 &rarr; 系统 &rarr; 日志文件夹路径），文件开头有一行阻止浏览器读取它的内容。默认：sgcache.log"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE="最大日志大小（MB）"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE_DESC="当日志文件超过此大小时，将进行轮换。保留最近5个轮换文件。默认：5 MB。"
PLG_SYSTEM_SGCACHE_LOG_VIEWER="日志查看器"
PLG_SYSTEM_SGCACHE_LOG_VIEWER_DESC="查看、下载、测试或清除cache日志。"

