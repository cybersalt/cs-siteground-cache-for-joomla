; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="欢迎使用Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="一个与SiteGround服务器端动态cache集成的Joomla 5 / 6系统插件。带来更快的页面加载、内容更改时自动清除cache，以及让SiteGround边缘服务器真正缓存页面所需的正确HTTP头。"
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="快速入门"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>确认已检测到SiteGround。</strong> 打开 <em>Cache设置</em> 选项卡，查看顶部的状态面板。SiteGround主机磁贴应显示「已检测到」。如果没有，此插件不会起任何作用 &mdash; 它只能在SiteGround服务器上运行。"
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>保持默认设置。</strong> 动态cache、自动清除和抑制会话Cookie默认全部开启。这几乎适用于所有站点。"
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>验证是否生效。</strong> 在隐私/无痕窗口中打开您的站点并检查响应头。您应看到 <code>X-Cache-Enabled: True</code>，并且<em>没有</em> <code>Set-Cookie</code>。一分钟后再检查一次 &mdash; <code>X-Proxy-Cache: HIT</code> 表示SiteGround已开始从cache提供页面。"
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>观察cache命中率上升。</strong> 访问您的SiteGround控制面板，在接下来的24&ndash;48小时内，随着边缘服务器存满缓存页面，cache命中率会逐步提高。"
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="提示"
PLG_SYSTEM_SGCACHE_GS_TIP_1="含有Convert Forms、RSForm! Pro或登录模块的页面会在去掉表单安全令牌后被缓存；每位访客的浏览器在使用表单时获取自己的令牌。含有任何其他Joomla表单的页面会被检测到并保持不缓存，因此其表单仍能正常工作。点击Cache设置选项卡上的 <em>测试我的首页</em>，可查看页面是否被缓存，以及未被缓存的原因。<em>排除的URL</em> 或 <em>排除的菜单项</em> 只用于其他绝不能被缓存的页面，例如向每位访客显示不同内容的页面。"
PLG_SYSTEM_SGCACHE_GS_TIP_2="每当发布较大的内容更改时，可使用Joomla管理后台顶部栏的 <em>清除SiteGround cache</em> 按钮（默认启用）一键清空全部cache。它只清除SiteGround的cache；Joomla自带的清除缓存不会清除它。"
PLG_SYSTEM_SGCACHE_GS_TIP_3="排查问题时，请在日志选项卡中开启日志。内嵌面板会实时显示每一个cache决策。在生产环境中请关闭它以保持速度。"

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="关于此插件"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache是由Cybersalt构建和维护的免费开源Joomla 5 / 6扩展。它填补了SiteGround的cache缺口，正是这个缺口让SiteGround上的每个Joomla站点都在无cache状态下运行 &mdash; 直到现在。"
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="资源"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="更多Cybersalt Joomla扩展"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="GitHub上的源代码"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="报告错误 / 请求功能"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="支持 &amp; 错误报告"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="如果您发现错误或有功能需求，请在GitHub上提交issue或直接联系Cybersalt。我们会回复每一份报告 &mdash; 此插件在我们管理的生产站点上持续维护。"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="致谢"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="SiteGround cache通信协议（用于清除cache的UNIX套接字API）是通过研究SiteGround的WordPress插件Speed Optimizer（GPLv3）了解到的。未复制任何WordPress代码；这是使用Joomla 5原生插件API从零编写的独立Joomla实现。与SiteGround无关联，也未获其认可。"
