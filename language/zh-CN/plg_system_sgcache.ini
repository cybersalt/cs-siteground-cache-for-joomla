PLG_SYSTEM_SGCACHE_VARY_USER_AGENT_DESC="添加Vary: User-Agent头，为移动端和桌面端浏览器提供不同的cache版本。"
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN="为已登录用户缓存"
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN_DESC="允许为已登录用户缓存。警告：可能向用户显示不正确的内容。仅当您的站点向所有用户提供相同内容时才启用。"
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE="在可缓存页面上抑制会话Cookie"
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE_DESC="在可缓存的匿名GET请求上移除Joomla的Set-Cookie响应头，使SiteGround的边缘服务器能真正缓存这些页面。否则，SiteGround会因为会话Cookie而跳过缓存每一次访客访问（X-Proxy-Cache-Info: SKIP_CACHE_SET_COOKIE）。排除的URL和组件不受影响，仍会为表单/CSRF获得完整会话。除非某个第三方插件需要在可缓存的匿名页面上设置Cookie，否则请保持开启。"
PLG_SYSTEM_SGCACHE_PURGE_BUTTON="手动清除cache"
PLG_SYSTEM_SGCACHE_PURGE_BUTTON_DESC="点击手动清除所有SiteGround cache。"

