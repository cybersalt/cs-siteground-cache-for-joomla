; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Bem-vindo ao Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="Um plugin de sistema para Joomla 5 / 6 que se integra ao cache dinâmico do lado do servidor do SiteGround. Tenha carregamentos de página mais rápidos, limpeza automática do cache quando o conteúdo muda e os cabeçalhos HTTP certos para que a edge do SiteGround de fato armazene suas páginas em cache."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Início Rápido"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Confirme que o SiteGround foi detectado.</strong> Abra a aba <em>Cache</em> e veja o painel de status no topo. O bloco Hospedagem SiteGround deve indicar 'Detectada'. Caso contrário, este plugin não fará nada &mdash; ele só funciona em servidores SiteGround."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Mantenha os padrões.</strong> Cache Dinâmico, Limpeza Automática e Suprimir Cookie de Sessão vêm todos ATIVADOS por padrão. Essa é a configuração certa para quase todos os sites."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Verifique se está funcionando.</strong> Abra seu site em uma janela privada/anônima e confira os cabeçalhos de resposta. Você deve ver <code>X-Cache-Enabled: True</code> e <em>nenhum</em> <code>Set-Cookie</code>. Confira de novo após um minuto &mdash; <code>X-Proxy-Cache: HIT</code> significa que o SiteGround agora está servindo a partir do cache."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Acompanhe a taxa de cache subir.</strong> Acesse seu painel do SiteGround e acompanhe a taxa de cache melhorar nas próximas 24&ndash;48 horas, à medida que a edge se enche de páginas em cache."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Dicas"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Páginas com Convert Forms, RSForm! Pro ou o módulo de login são armazenadas em cache sem o token de segurança do formulário; o navegador de cada visitante busca o seu próprio quando ele usa o formulário. Páginas com qualquer outro formulário do Joomla são detectadas e deixadas fora do cache, para que seus formulários continuem funcionando. Clique em <em>Testar minha página inicial</em> na aba Cache para ver se suas páginas estão em cache e, se não estiverem, por quê. Use <em>URLs Excluídas</em> ou <em>Itens de Menu Excluídos</em> apenas para outras páginas que nunca devem ser armazenadas em cache, como páginas que mostram conteúdo diferente para cada visitante."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Use o botão <em>Limpar Cache do SiteGround</em> na barra superior do admin do Joomla (habilitado por padrão) para limpar todo o cache com um clique sempre que publicar uma grande alteração de conteúdo. Ele limpa apenas o cache do SiteGround; o Limpar Cache do próprio Joomla não faz isso."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Ative a aba Registro se estiver solucionando problemas. O painel integrado mostra cada decisão de cache em tempo real. Desative em produção para manter tudo ágil."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="Sobre este plugin"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="O Cybersalt SiteGround Cache é uma extensão gratuita e de código aberto para Joomla 5 / 6, criada e mantida pela Cybersalt. Ela fecha a lacuna de cache do SiteGround que deixava todo site Joomla no SiteGround funcionando sem cache &mdash; até agora."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Recursos"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="Mais extensões Joomla da Cybersalt"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="Código-fonte no GitHub"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Relatar um bug / Solicitar um recurso"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Suporte &amp; relatos de bugs"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="Se encontrar um bug ou tiver uma sugestão de recurso, abra uma issue no GitHub ou entre em contato diretamente com a Cybersalt. Respondemos a todos os relatos &mdash; este plugin é mantido ativamente em sites de produção que gerenciamos."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Atribuição"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="O protocolo de comunicação de cache do SiteGround (API de socket UNIX para limpeza de cache) foi aprendido estudando o plugin Speed Optimizer do SiteGround para WordPress (GPLv3). Nenhum código do WordPress foi copiado; esta é uma implementação Joomla independente, escrita do zero com a API de plugins nativa do Joomla 5. Não afiliado ou endossado pelo SiteGround."
