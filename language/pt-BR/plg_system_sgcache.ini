; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Habilitar Cache Dinâmico"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Habilita os cabeçalhos de cache dinâmico do SiteGround. As páginas serão marcadas como armazenáveis em cache para o proxy reverso do SiteGround."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Limpeza Automática ao Alterar Conteúdo"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Limpa automaticamente as entradas de cache relacionadas quando o conteúdo é salvo, excluído ou o estado é alterado."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Limite de Limpeza"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Se mais do que este número de URLs precisarem de limpeza, uma limpeza completa do cache será realizada em vez de limpar individualmente. Padrão: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="URLs Excluídas"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="Um caminho de URL por linha (relativo à raiz do site) que nunca deve ser armazenado em cache. Um caminho simples também abrange tudo o que começa com ele: <code>/members</code> abrange <code>/members/profile</code>. Use <code>*</code> para qualquer texto (<code>/shop/*/checkout</code>), termine uma linha com <code>$</code> para corresponder apenas a esse caminho (<code>/about$</code>) e inclua <code>?</code> para corresponder também à query string (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Itens de Menu Excluídos"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="As páginas exibidas sob estes itens de menu nunca são armazenadas em cache. Mais fácil do que adivinhar caminhos de URL. O Joomla também usa um item de menu para as páginas acessadas por meio dele, como os artigos de um blog de categoria."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Parâmetros de Consulta Armazenáveis em Cache"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Páginas com query string não são armazenadas em cache, exceto as que têm parâmetros de rastreamento de marketing (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), que não alteram a página. Liste aqui outros parâmetros, um por linha, para que essas páginas também possam ser armazenadas em cache, por exemplo <code>start</code> ou <code>limitstart</code> para paginação. <code>format</code>, <code>tmpl</code> e <code>task</code> nunca são armazenados em cache, nem uma página cuja URL mistura um parâmetro listado com um de rastreamento: o SiteGround a armazenaria sob o caminho sem parâmetros."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="User Agents Excluídos"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="Um trecho de texto por linha, por exemplo <code>Feedly</code> ou <code>UptimeRobot</code>. Quando o user agent de um visitante contém esse texto (maiúsculas e minúsculas não importam), a página gerada para ele não é armazenada no cache. Observação: o SiteGround ainda pode responder a ele com uma cópia armazenada em cache para outra pessoa, a menos que <em>Variar por User Agent</em> esteja ativado (aba Avançado)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Páginas com formulários"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Um formulário do Joomla carrega um token de segurança que pertence à sessão do visitante, então uma cópia em cache não pode simplesmente ser compartilhada. Com <em>Armazenar em Cache Páginas com Formulários</em> ativado, o plugin armazena a página em cache sem o token, e o navegador do visitante busca o próprio token na primeira vez que ele usa o formulário. Formulários não marcados abaixo, e formulários que o plugin não reconhece, mantêm sua página fora do cache como antes."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Armazenar em Cache Páginas com Formulários"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Armazena em cache páginas cujos únicos formulários são dos tipos marcados abaixo, com o token de cada visitante buscado por script. Requer JavaScript no navegador do visitante (o Convert Forms precisa dele de qualquer forma). Depois de ativar, envie cada formulário uma vez em uma janela anônima para verificá-lo. Desative para manter fora do cache toda página com formulário."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Formulários que Podem Ser Armazenados em Cache"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Tipos de formulário que sabidamente não precisam de nada da sessão do visitante além do token."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Módulo de login do Joomla"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Outros Formulários (marcadores)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="Para outros formulários que precisam apenas do token: um trecho de texto por linha que aparece no HTML do formulário, como <code>id=&quot;newsletter&quot;</code>. Só adicione um formulário aqui depois de verificar que ele não guarda mais nada na sessão do visitante (uma resposta de captcha, um carrinho, o estado de várias etapas)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Componentes Excluídos"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Selecione os componentes cujas páginas nunca devem ser armazenadas em cache pelo SiteGround."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Mostrar Botão Limpar no Admin"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Exibe um botão 'Limpar Cache do SiteGround' na barra superior da área de administração do Joomla, visível em todas as páginas. Ele limpa apenas o cache do servidor do SiteGround. O Sistema &rarr; Limpar Cache do próprio Joomla e os botões de limpeza de cache de otimizadores como o JCH Optimize não afetam o cache do SiteGround, e este botão não afeta o deles."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Modo do Botão"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Simples: um botão que limpa todo o cache. Dropdown: um botão dividido com 'Limpar Tudo' mais opções de caminhos personalizados."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Simples - Limpar Tudo"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Dropdown - Limpar Tudo + Caminhos Personalizados"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Caminhos de Limpeza Personalizados"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="Uma entrada por linha no formato: Rótulo|/caminho. Estas aparecem como opções no dropdown. Exemplo: Blog|/blog ou Seção de Notícias|/noticias"

; Toolbar button labels
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE="Limpar Cache do SiteGround"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_TITLE="Limpa o cache do servidor do SiteGround (não o cache do próprio Joomla)"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_ALL="Limpar Todo o Cache"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_LABEL="Limpar Caminho Específico"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGING="Limpando..."

; Logging & debug settings
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING="Habilitar Registro em Arquivo"
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING_DESC="Grava as operações de cache em um arquivo de log no diretório de logs do Joomla. Útil para solução de problemas. Desative em produção para melhor desempenho."
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING="Modo Detalhado"
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING_DESC="Registra cada visita à página frontend incluindo respostas com cache habilitado. Quando desativado, apenas bypasses de cache, limpezas, erros e alterações de conteúdo são registrados. Ative temporariamente para solução de problemas, depois desative em produção."
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG="Habilitar Painel de Debug"
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG_DESC="Mostra um painel de debug na parte inferior de cada página de administração exibindo as operações de cache que ocorreram durante a requisição atual. Visível apenas para administradores."
PLG_SYSTEM_SGCACHE_LOG_FILE="Nome do Arquivo de Log"
PLG_SYSTEM_SGCACHE_LOG_FILE_DESC="Nome do arquivo de log. Ele é salvo com este nome mais .php na pasta de logs do Joomla (Configuração Global &rarr; Sistema &rarr; Caminho para a Pasta de Logs) e começa com uma linha que impede que um navegador o leia. Padrão: sgcache.log"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE="Tamanho Máximo do Log (MB)"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE_DESC="Quando o arquivo de log exceder este tamanho, será rotacionado. Mantém os últimos 5 arquivos rotacionados. Padrão: 5 MB."
PLG_SYSTEM_SGCACHE_LOG_VIEWER="Visualizador de Log"
PLG_SYSTEM_SGCACHE_LOG_VIEWER_DESC="Visualize, baixe, teste ou limpe o log de cache."

