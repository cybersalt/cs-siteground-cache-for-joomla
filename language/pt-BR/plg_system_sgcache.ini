; Session-handling group note in Advanced tab
PLG_SYSTEM_SGCACHE_SESSION_HANDLING_NOTE="<strong>Gerenciamento de sessão.</strong> Estas duas configurações determinam se o SiteGround consegue de fato armazenar em cache o tráfego anônimo. Os padrões (<em>Cache para Usuários Autenticados: Não</em>, <em>Suprimir Cookie de Sessão: Sim</em>) são corretos para quase todos os sites."

