PLG_SYSTEM_SGCACHE_VARY_USER_AGENT="Variar por User Agent"
PLG_SYSTEM_SGCACHE_VARY_USER_AGENT_DESC="Adiciona o cabeçalho Vary: User-Agent para servir diferentes versões em cache para navegadores móveis e desktop."
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN="Cache para Usuários Autenticados"
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN_DESC="Permitir cache para usuários autenticados. ATENÇÃO: Pode mostrar conteúdo incorreto aos usuários. Habilite apenas se seu site exibe o mesmo conteúdo para todos os usuários."
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE="Suprimir Cookie de Sessão em Páginas Armazenáveis em Cache"
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE_DESC="Remove o cabeçalho de resposta Set-Cookie do Joomla em requisições GET anônimas armazenáveis em cache, para que a edge do SiteGround consiga de fato armazená-las em cache. Sem isso, o SiteGround deixa de armazenar em cache todo acesso de visitante por causa do cookie de sessão (X-Proxy-Cache-Info: SKIP_CACHE_SET_COOKIE). URLs e componentes excluídos não são afetados e continuam recebendo sessões completas para formulários/CSRF. Deixe ATIVADO, a menos que um plugin de terceiros precise definir cookies em páginas anônimas armazenáveis em cache."
PLG_SYSTEM_SGCACHE_PURGE_BUTTON="Limpeza Manual do Cache"
PLG_SYSTEM_SGCACHE_PURGE_BUTTON_DESC="Clique para limpar manualmente todo o cache do SiteGround."

