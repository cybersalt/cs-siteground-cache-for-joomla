PLG_SYSTEM_SGCACHE_REASON_SUPPRESS_SESSION_COOKIE_OFF="Non in cache: Sopprimi Cookie di Sessione è disattivato (scheda Impostazioni Avanzate), quindi ogni pagina imposta un cookie."
