; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Benvenuto in Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="Un plugin di sistema per Joomla 5 / 6 che si integra con la cache dinamica lato server di SiteGround. Caricamenti di pagina più rapidi, svuotamento automatico della cache quando il contenuto cambia e le intestazioni HTTP corrette perché l'edge di SiteGround memorizzi davvero le tue pagine nella cache."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Avvio Rapido"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Verifica che SiteGround sia rilevato.</strong> Apri la scheda <em>Impostazioni Cache</em> e guarda il pannello di stato in alto. Il riquadro Hosting SiteGround dovrebbe indicare 'Rilevato'. In caso contrario, questo plugin non farà nulla &mdash; funziona solo sui server SiteGround."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Lascia i valori predefiniti.</strong> Cache Dinamica, Svuotamento Automatico e Sopprimi Cookie di Sessione sono tutti ATTIVI per impostazione predefinita. È la configurazione giusta per quasi ogni sito."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Verifica che funzioni.</strong> Apri il tuo sito in una finestra privata/in incognito e controlla le intestazioni di risposta. Dovresti vedere <code>X-Cache-Enabled: True</code> e <em>nessun</em> <code>Set-Cookie</code>. Ricontrolla dopo un minuto &mdash; <code>X-Proxy-Cache: HIT</code> significa che SiteGround ora risponde dalla cache."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Guarda salire il rapporto di cache.</strong> Visita la tua dashboard di SiteGround e osserva il rapporto di cache migliorare nelle prossime 24&ndash;48 ore, man mano che l'edge si riempie di pagine in cache."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Suggerimenti"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Le pagine con Convert Forms, RSForm! Pro o il modulo di login vengono memorizzate nella cache senza il token di sicurezza del modulo; il browser di ogni visitatore recupera il proprio quando usa il modulo. Le pagine con qualsiasi altro modulo Joomla vengono rilevate e lasciate fuori dalla cache, così i loro moduli continuano a funzionare. Clicca <em>Testa la mia home page</em> nella scheda Impostazioni Cache per vedere se le tue pagine sono in cache, e perché no se non lo sono. Usa <em>URL Esclusi</em> o <em>Voci di Menu Escluse</em> solo per altre pagine che non devono mai essere memorizzate, come le pagine che mostrano contenuti diversi a ogni visitatore."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Usa il pulsante <em>Svuota la Cache di SiteGround</em> nella barra superiore dell'amministrazione di Joomla (attivo per impostazione predefinita) per svuotare tutta la cache con un clic ogni volta che pubblichi una modifica importante ai contenuti. Svuota solo la cache di SiteGround; la funzione Pulisci cache di Joomla non lo fa."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Attiva la registrazione (scheda Registrazione) se stai risolvendo problemi. La dashboard integrata mostra ogni decisione della cache in tempo reale. Disattivala in produzione per mantenere tutto reattivo."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="Informazioni su questo plugin"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache è un'estensione gratuita e open source per Joomla 5 / 6, sviluppata e mantenuta da Cybersalt. Colma la lacuna di caching di SiteGround che ha lasciato ogni sito Joomla su SiteGround senza cache &mdash; fino ad ora."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Risorse"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="Altre estensioni Joomla di Cybersalt"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="Codice sorgente su GitHub"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Segnala un bug / Richiedi una funzionalità"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Supporto &amp; segnalazione bug"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="Se trovi un bug o hai una richiesta di funzionalità, apri una issue su GitHub o contatta direttamente Cybersalt. Rispondiamo a ogni segnalazione &mdash; questo plugin è mantenuto attivamente sui siti in produzione che gestiamo."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Attribuzione"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="Il protocollo di comunicazione della cache di SiteGround (API socket UNIX per lo svuotamento della cache) è stato appreso studiando il plugin Speed Optimizer di SiteGround per WordPress (GPLv3). Nessun codice WordPress è stato copiato; questa è un'implementazione Joomla indipendente, scritta da zero con l'API nativa dei plugin di Joomla 5. Non affiliato con e non approvato da SiteGround."
