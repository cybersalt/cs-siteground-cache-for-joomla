; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Abilita Cache Dinamica"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Abilita le intestazioni della cache dinamica di SiteGround. Le pagine saranno contrassegnate come memorizzabili nella cache per il reverse proxy di SiteGround."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Svuotamento Automatico alla Modifica del Contenuto"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Svuota automaticamente le voci della cache correlate quando il contenuto viene salvato, eliminato o lo stato viene modificato."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Soglia di Svuotamento"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Se il numero di URL da svuotare supera questo valore, verrà eseguito uno svuotamento completo della cache anziché uno svuotamento individuale. Predefinito: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="URL Esclusi"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="Un percorso URL per riga (relativo alla radice del sito) che non deve mai essere memorizzato nella cache. Un percorso semplice copre anche tutto ciò che inizia con esso: <code>/members</code> copre <code>/members/profile</code>. Usa <code>*</code> per qualsiasi testo (<code>/shop/*/checkout</code>), termina una riga con <code>$</code> per far corrispondere solo quel percorso (<code>/about$</code>) e includi <code>?</code> per far corrispondere anche la query string (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Voci di Menu Escluse"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Le pagine mostrate sotto queste voci di menu non vengono mai memorizzate nella cache. Più semplice che indovinare i percorsi URL. Joomla usa una voce di menu anche per le pagine raggiunte tramite essa, come gli articoli di un blog di categoria."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Parametri di Query Memorizzabili"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Le pagine con una query string non vengono memorizzate nella cache, tranne che per i parametri di tracciamento marketing (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), che non cambiano la pagina. Elenca qui altri parametri, uno per riga, per consentire la memorizzazione anche di quelle pagine, ad esempio <code>start</code> o <code>limitstart</code> per la paginazione. <code>format</code>, <code>tmpl</code> e <code>task</code> non vengono mai memorizzati, e nemmeno una pagina il cui URL mescola un parametro elencato con uno di tracciamento: SiteGround la memorizzerebbe sotto il percorso semplice."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="User Agent Esclusi"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="Un testo per riga, ad esempio <code>Feedly</code> o <code>UptimeRobot</code>. Quando lo user agent di un visitatore lo contiene (maiuscole e minuscole non contano), la pagina generata per lui non viene salvata nella cache. Nota: SiteGround può comunque rispondergli con una copia memorizzata per qualcun altro, a meno che <em>Variazione per User Agent</em> sia attiva (scheda Impostazioni Avanzate)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Pagine con moduli"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Un modulo Joomla contiene un token di sicurezza che appartiene alla sessione del visitatore, quindi una copia in cache non può essere semplicemente condivisa. Con <em>Memorizza in Cache le Pagine con Moduli</em> attivo, il plugin memorizza la pagina senza il token e il browser del visitatore recupera il proprio token la prima volta che usa il modulo. I moduli non spuntati qui sotto, e quelli che il plugin non riconosce, lasciano la loro pagina fuori dalla cache come prima."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Memorizza in Cache le Pagine con Moduli"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Memorizza nella cache le pagine i cui unici moduli sono dei tipi spuntati qui sotto, recuperando via script il token di ogni visitatore. Richiede JavaScript nel browser del visitatore (Convert Forms ne ha comunque bisogno). Dopo averla attivata, invia ogni modulo una volta in una finestra privata per verificarlo. Disattivala per mantenere fuori dalla cache ogni pagina con un modulo."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Moduli che Possono Essere Memorizzati"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Tipi di modulo noti per non aver bisogno di nulla dalla sessione del visitatore oltre al token."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Modulo di login di Joomla"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Altri Moduli (marcatori)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="Per altri moduli che richiedono solo il token: un testo per riga che compare nell'HTML del modulo, ad esempio <code>id=&quot;newsletter&quot;</code>. Aggiungi un modulo qui solo dopo aver verificato che non conservi nient'altro nella sessione del visitatore (una risposta captcha, un carrello, uno stato a più passaggi)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Componenti Esclusi"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Seleziona i componenti le cui pagine non devono mai essere memorizzate nella cache da SiteGround."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Mostra Pulsante Svuota nell'Amministrazione"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Mostra un pulsante 'Svuota la Cache di SiteGround' nella barra superiore dell'area di amministrazione di Joomla, visibile su ogni pagina. Svuota solo la cache del server di SiteGround. La funzione Sistema &rarr; Pulisci cache di Joomla e i pulsanti di pulizia della cache di ottimizzatori come JCH Optimize non toccano la cache di SiteGround, e questo pulsante non tocca la loro."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Modalità Pulsante"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Semplice: un pulsante che svuota tutta la cache. Dropdown: un pulsante con 'Svuota Tutto' più opzioni di percorso personalizzate."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Semplice - Svuota Tutto"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Dropdown - Svuota Tutto + Percorsi Personalizzati"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Percorsi di Svuotamento Personalizzati"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="Una voce per riga nel formato: Etichetta|/percorso. Queste appaiono come opzioni nel dropdown. Esempio: Blog|/blog o Sezione Notizie|/notizie"

; Toolbar button labels
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE="Svuota la Cache di SiteGround"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_TITLE="Svuota la cache del server di SiteGround (non la cache di Joomla)"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_ALL="Svuota Tutta la Cache"
