PLG_SYSTEM_SGCACHE_SESSION_HANDLING_NOTE="<strong>Gestione della sessione.</strong> Queste due impostazioni determinano se SiteGround può davvero memorizzare nella cache il traffico anonimo. I valori predefiniti (<em>Cache per Utenti Autenticati: No</em>, <em>Sopprimi Cookie di Sessione: Sì</em>) sono corretti per quasi ogni sito."

