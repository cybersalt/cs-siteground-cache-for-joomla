; Home page watchdog (System > Scheduled Tasks)
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE_LABEL="Controllo della home page"
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE="Un'attività pianificata può recuperare la tua home page ogni pochi minuti e, se mai torna come qualcosa di diverso da una pagina web, svuotare la cache di SiteGround e inviarti un'email. Il programma di installazione la aggiunge non pubblicata: vai in <a href='index.php?option=com_scheduler&amp;view=tasks'>Sistema &rarr; Attività pianificate</a>, apri <em>SiteGround Cache: controllo della home page</em> e pubblicala."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_TITLE="SiteGround Cache: controllo della home page"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_DESC="Recupera la home page (ed eventuali percorsi aggiuntivi) come visitatore. Se una torna come qualcosa di diverso da una pagina HTML, svuota la cache di SiteGround, ricontrolla e invia un rapporto via email."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_SITE_URL_LABEL="Indirizzo del sito"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_SITE_URL_DESC="L'indirizzo della home page del sito, ad esempio https://www.example.com/. Compilato automaticamente; serve perché un'attività eseguita da riga di comando (cli/joomla.php) non può ricavare da sola l'indirizzo del sito."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_NOTIFY_EMAIL_LABEL="Invia i rapporti a"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_NOTIFY_EMAIL_DESC="Lascia vuoto per usare l'email mittente del sito (Configurazione globale &rarr; Server &rarr; Mail)."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_EXTRA_PATHS_LABEL="Controlla anche questi percorsi"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_EXTRA_PATHS_DESC="Un percorso per riga, che inizia con /, ad esempio /blog. La home page viene sempre controllata."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_SUBJECT="%s: la cache di SiteGround ha servito una pagina non funzionante"
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_INTRO="Il controllo SiteGround Cache su %1$s (%2$s) ha recuperato queste pagine come visitatore e non sono tornate come normali pagine web:"
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_PURGED="La cache di SiteGround è stata svuotata."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_PURGE_FAILED="Lo svuotamento della cache di SiteGround non è riuscito. Usa il pulsante Svuota la Cache di SiteGround nell'amministrazione di Joomla."
