; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Vítejte v Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="Systémový plugin pro Joomla 5 / 6, který se propojuje s dynamickou cache SiteGround na straně serveru. Získáte rychlejší načítání stránek, automatické promazání cache při změnách obsahu a správné hlavičky HTTP, aby edge SiteGround vaše stránky skutečně ukládal do cache."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Rychlý Start"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Ověřte, že je SiteGround detekován.</strong> Otevřete kartu <em>Nastavení Cache</em> a podívejte se na stavový panel nahoře. Dlaždice Hosting SiteGround by měla ukazovat 'Detekováno'. Pokud ne, tento plugin nic neudělá &mdash; funguje pouze na serverech SiteGround."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Ponechte výchozí nastavení.</strong> Dynamická cache, automatické promazání a potlačení cookie relace jsou ve výchozím stavu ZAPNUTÉ. To je správné nastavení téměř pro každý web."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Ověřte, že to funguje.</strong> Otevřete svůj web v anonymním okně a zkontrolujte hlavičky odpovědi. Měli byste vidět <code>X-Cache-Enabled: True</code> a <em>žádné</em> <code>Set-Cookie</code>. Po minutě zkontrolujte znovu &mdash; <code>X-Proxy-Cache: HIT</code> znamená, že SiteGround nyní obsluhuje z cache."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Sledujte růst poměru cache.</strong> Navštivte svůj panel SiteGround a sledujte, jak se poměr cache během příštích 24&ndash;48 hodin zlepšuje, jak se edge plní stránkami z cache."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Tipy"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Stránky s Convert Forms, RSForm! Pro nebo přihlašovacím modulem se ukládají do cache s odstraněným bezpečnostním tokenem formuláře; prohlížeč každého návštěvníka si při použití formuláře načte vlastní. Stránky s jakýmkoli jiným formulářem Joomla jsou rozpoznány a ponechány mimo cache, takže jejich formuláře dál fungují. Klikněte na <em>Otestovat mou domovskou stránku</em> na kartě Nastavení Cache a zjistěte, zda jsou vaše stránky v cache, a pokud ne, proč. <em>Vyloučená URL</em> nebo <em>Vyloučené Položky Menu</em> používejte jen pro jiné stránky, které se nikdy nesmí ukládat do cache, například stránky zobrazující každému návštěvníkovi jiný obsah."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Použijte tlačítko <em>Promazat Cache SiteGround</em> v horní liště administrace Joomla (ve výchozím stavu zapnuto) pro úplné vyprázdnění cache jedním kliknutím, kdykoli provedete velkou změnu obsahu. Promaže pouze cache SiteGround; vlastní Vyčistit cache Joomla to nedělá."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Při řešení problémů zapněte protokolování na kartě Protokolování. Vložený panel ukazuje každé rozhodnutí o cache v reálném čase. V produkci jej vypněte, aby vše běželo svižně."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="O tomto pluginu"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache je bezplatné rozšíření s otevřeným zdrojovým kódem pro Joomla 5 / 6, které vytváří a udržuje Cybersalt. Zaplňuje mezeru v cachování SiteGround, kvůli které každý web Joomla na SiteGround běžel bez cache &mdash; až dosud."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Zdroje"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="Další rozšíření Joomla od Cybersalt"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="Zdrojový kód na GitHubu"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Nahlásit chybu / Požádat o funkci"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Podpora &amp; hlášení chyb"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="Pokud najdete chybu nebo máte požadavek na funkci, otevřete issue na GitHubu nebo kontaktujte přímo Cybersalt. Odpovídáme na každé hlášení &mdash; tento plugin je aktivně udržován na produkčních webech, které spravujeme."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Uvedení zdroje"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="Komunikační protokol cache SiteGround (API přes UNIX socket pro promazání cache) byl zjištěn studiem pluginu Speed Optimizer od SiteGround pro WordPress (GPLv3). Žádný kód z WordPressu nebyl zkopírován; jde o nezávislou implementaci pro Joomla napsanou od nuly pomocí nativního API pluginů Joomla 5. Není spojeno se SiteGround ani jím schváleno."
