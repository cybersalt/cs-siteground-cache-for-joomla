; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Povolit Dynamickou Cache"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Povolit hlavičky dynamické cache SiteGround. Stránky budou označeny jako uložitelné do cache pro reverzní proxy SiteGround."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Automatické Promazání při Změně Obsahu"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Automaticky promazat související položky cache při uložení, smazání nebo změně stavu obsahu."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Práh Promazání"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Pokud je potřeba promazat více URL než tento počet, provede se úplné vymazání cache místo jednotlivého promazání. Výchozí: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="Vyloučená URL"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="Jedna cesta URL na řádek (relativní ke kořeni webu), která se nikdy nemá ukládat do cache. Prostá cesta pokrývá i vše, co jí začíná: <code>/members</code> pokrývá <code>/members/profile</code>. Použijte <code>*</code> pro libovolný text (<code>/shop/*/checkout</code>), ukončete řádek znakem <code>$</code> pro shodu pouze s danou cestou (<code>/about$</code>) a přidejte <code>?</code>, chcete-li porovnávat i řetězec dotazu (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Vyloučené Položky Menu"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Stránky zobrazené pod těmito položkami menu se nikdy neukládají do cache. Jednodušší než hádat cesty URL. Joomla používá položku menu i pro stránky, na které se přes ni dostanete, například články blogu kategorie."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Parametry Dotazu Povolené v Cache"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Stránky s řetězcem dotazu se do cache neukládají, kromě marketingových sledovacích parametrů (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), které stránku nemění. Zde uveďte další parametry, jeden na řádek, aby se i tyto stránky mohly ukládat do cache, například <code>start</code> nebo <code>limitstart</code> pro stránkování. Parametry <code>format</code>, <code>tmpl</code> a <code>task</code> se do cache nikdy neukládají, stejně jako stránka, jejíž URL kombinuje uvedený parametr se sledovacím: SiteGround by ji uložil pod holou cestou."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="Vyloučené User Agenty"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="Jeden text na řádek, například <code>Feedly</code> nebo <code>UptimeRobot</code>. Když jej user agent návštěvníka obsahuje (na velikosti písmen nezáleží), stránka vykreslená pro něj se do cache neuloží. Poznámka: SiteGround mu i tak může odpovědět kopií uloženou v cache pro někoho jiného, pokud není zapnuto <em>Rozlišovat podle User Agent</em> (karta Pokročilá Nastavení)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Stránky s formuláři"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Formulář Joomla nese bezpečnostní token, který patří k relaci návštěvníka, takže kopii v cache nelze jednoduše sdílet. Když je zapnuto <em>Ukládat do Cache Stránky s Formuláři</em>, plugin uloží stránku do cache bez tokenu a prohlížeč návštěvníka si při prvním použití formuláře načte vlastní token. Formuláře, které níže nejsou zaškrtnuté, a formuláře, které plugin nerozpozná, ponechají svou stránku mimo cache jako dosud."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Ukládat do Cache Stránky s Formuláři"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Ukládat do cache stránky, jejichž jediné formuláře jsou níže zaškrtnutých druhů, přičemž token každého návštěvníka se načte skriptem. Vyžaduje JavaScript v prohlížeči návštěvníka (Convert Forms jej potřebuje tak jako tak). Po zapnutí odešlete každý formulář jednou v anonymním okně a ověřte jej. Vypněte, chcete-li ponechat každou stránku s formulářem mimo cache."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Formuláře, Které Lze Ukládat do Cache"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Typy formulářů, o kterých je známo, že z relace návštěvníka nepotřebují nic kromě tokenu."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Přihlašovací modul Joomla"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Jiné Formuláře (značky)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="Pro jiné formuláře, které potřebují pouze token: jeden text na řádek, který se objevuje v HTML formuláře, například <code>id=&quot;newsletter&quot;</code>. Formulář sem přidejte až po ověření, že v relaci návštěvníka neukládá nic dalšího (odpověď na captchu, košík, stav vícekrokového formuláře)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Vyloučené Komponenty"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Vyberte komponenty, jejichž stránky se nikdy nemají ukládat do cache SiteGround."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Zobrazit Tlačítko Promazání v Administraci"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Zobrazit tlačítko 'Promazat Cache SiteGround' v horní liště administrace Joomla, viditelné na každé stránce. Promaže pouze serverovou cache SiteGround. Vlastní funkce Joomla Systém &rarr; Vyčistit cache ani tlačítka pro vyčištění cache optimalizátorů, jako je JCH Optimize, cache SiteGround neovlivňují a toto tlačítko neovlivňuje tu jejich."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Režim Tlačítka"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Jednoduché: jedno tlačítko, které promaže veškerou cache. Rozbalovací: rozdělené tlačítko s 'Promazat Vše' a volbami vlastních cest."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Jednoduché - Promazat Vše"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Rozbalovací - Promazat Vše + Vlastní Cesty"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Vlastní Cesty Promazání"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="Jeden záznam na řádek ve formátu: Popisek|/cesta. Tyto se zobrazí jako volby v rozbalovacím menu. Příklad: Blog|/blog nebo News Section|/news"

