PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN="Cache pro Přihlášené Uživatele"
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN_DESC="Povolit ukládání do cache pro přihlášené uživatele. VAROVÁNÍ: Může zobrazit nesprávný obsah uživatelům. Povolte pouze pokud váš web zobrazuje stejný obsah všem uživatelům."
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE="Potlačit Cookie Relace na Stránkách Ukládaných do Cache"
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE_DESC="Odstranit hlavičku odpovědi Set-Cookie od Joomla u anonymních požadavků GET, které lze uložit do cache, aby je edge SiteGround mohl skutečně ukládat. Bez toho SiteGround kvůli cookie relace přeskočí ukládání každé návštěvy hosta (X-Proxy-Cache-Info: SKIP_CACHE_SET_COOKIE). Vyloučená URL a komponenty zůstávají nedotčené a stále dostávají plné relace pro formuláře/CSRF. Nechte ZAPNUTO, pokud plugin třetí strany nepotřebuje nastavovat cookies na anonymních stránkách ukládaných do cache."
