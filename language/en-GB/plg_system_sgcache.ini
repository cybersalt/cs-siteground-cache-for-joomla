; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Enable Dynamic Cache"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Enable SiteGround dynamic cache headers. Pages will be marked as cacheable for SiteGround's reverse proxy."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Auto-Purge on Content Change"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Automatically purge related cache entries when content is saved, deleted, or state changed."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Purge Threshold"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="If more than this number of URLs need purging, a full cache flush will be performed instead of purging individually. Default: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="Excluded URLs"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="One URL path per line (relative to the site root) that should never be cached. A plain path also covers everything that starts with it: <code>/members</code> covers <code>/members/profile</code>. Use <code>*</code> for any text (<code>/shop/*/checkout</code>), end a line with <code>$</code> to match that path only (<code>/about$</code>), and include <code>?</code> to match the query string too (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Excluded Menu Items"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Pages shown under these menu items are never cached. Easier than guessing URL paths. Joomla also uses a menu item for pages reached through it, such as the articles of a category blog."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Cacheable Query Parameters"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Pages with a query string are not cached, except for marketing tracking parameters (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), which don't change the page. List other parameters here, one per line, to let those pages be cached too, for example <code>start</code> or <code>limitstart</code> for pagination. <code>format</code>, <code>tmpl</code> and <code>task</code> are never cached, and neither is a page whose URL mixes a listed parameter with a tracking one: SiteGround would store it under the bare path."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="Excluded User Agents"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="One piece of text per line, for example <code>Feedly</code> or <code>UptimeRobot</code>. When a visitor's user agent contains it (case doesn't matter), the page rendered for them is not stored in the cache. Note: SiteGround can still answer them from a copy cached for someone else, unless <em>Vary by User Agent</em> is on (Advanced tab)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Pages with forms"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="A Joomla form carries a security token that belongs to the visitor's session, so a cached copy can't simply be shared. With <em>Cache Pages with Forms</em> on, the plugin caches the page without the token and the visitor's browser fetches its own token the first time they use the form. Forms not ticked below, and forms the plugin doesn't recognise, keep their page uncached as before."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Cache Pages with Forms"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Cache pages whose only forms are the kinds ticked below, with each visitor's token fetched by script. Needs JavaScript in the visitor's browser (Convert Forms needs it anyway). After turning this on, send each form once in a private window to check it. Turn it off to keep every page with a form uncached."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Forms That May Be Cached"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Form types known to need nothing from the visitor's session except the token."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Joomla login module"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Other Forms (markers)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="For other forms that need only the token: one piece of text per line that appears inside the form's HTML, such as <code>id=&quot;newsletter&quot;</code>. Only add a form here after checking it doesn't keep anything else in the visitor's session (a captcha answer, a cart, a multi-step state)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Excluded Components"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Select components whose pages should never be cached by SiteGround."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Show Purge Button in Admin"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Display a 'Purge SiteGround Cache' button in the top bar of the Joomla administrator area, visible on every page. It clears SiteGround's server cache only. Joomla's own System &rarr; Clear Cache, and the clean-cache buttons of optimisers such as JCH Optimize, don't touch SiteGround's cache, and this button doesn't touch theirs."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Button Mode"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Simple: one button that purges all cache. Dropdown: a split button with 'Purge All' plus custom path options."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Simple - Purge All"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Dropdown - Purge All + Custom Paths"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Custom Purge Paths"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="One entry per line in the format: Label|/path. These appear as options in the dropdown. Example: Blog|/blog or News Section|/news"

