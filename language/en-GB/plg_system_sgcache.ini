; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Welcome to Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="A Joomla 5 / 6 system plugin that integrates with SiteGround's server-side dynamic cache. Get faster page loads, automatic cache purging on content changes, and the right HTTP headers so SiteGround's edge will actually cache your pages."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Quick Start"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Confirm SiteGround is detected.</strong> Open the <em>Cache</em> tab and look at the status panel at the top. The SiteGround Hosting tile should say 'Detected'. If not, this plugin won't do anything &mdash; it only works on SiteGround servers."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Leave the defaults alone.</strong> Dynamic Cache, Auto-Purge, and Suppress Session Cookie are all ON by default. That's the right setup for almost every site."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Verify it's working.</strong> Open your site in a private/incognito window and check the response headers. You should see <code>X-Cache-Enabled: True</code> and <em>no</em> <code>Set-Cookie</code>. Check again after a minute &mdash; <code>X-Proxy-Cache: HIT</code> means SiteGround is now serving from cache."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Watch the cache ratio climb.</strong> Visit your SiteGround dashboard and watch the cache ratio improve over the next 24&ndash;48 hours as the edge fills up with cached pages."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Tips"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Pages with Convert Forms, RSForm! Pro or the login module on them are cached with the form's security token taken out; each visitor's browser fetches its own when they use the form. Pages with any other Joomla form are detected and left uncached, so their forms keep working. Click <em>Test my home page</em> on the Cache tab to see whether your pages are cached, and why not if they aren't. Use <em>Excluded URLs</em> or <em>Excluded Menu Items</em> only for other pages that must never be cached, such as pages that show different content to each visitor."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Use the <em>Purge SiteGround Cache</em> button in the Joomla admin top bar (enabled by default) for a one-click full cache flush whenever you push a big content change. It clears SiteGround's cache only; Joomla's own Clear Cache doesn't."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Turn on the Logs tab if you're troubleshooting. The inline dashboard shows every cache decision in real time. Turn it off in production to keep things snappy."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="About this plugin"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache is a free, open-source Joomla 5 / 6 extension built and maintained by Cybersalt. It closes the SiteGround caching gap that's left every Joomla site on SiteGround running un-cached &mdash; until now."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Resources"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="More Cybersalt Joomla extensions"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="Source on GitHub"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Report a bug / Request a feature"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Support &amp; bug reports"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="If you find a bug or have a feature request, open an issue on GitHub or contact Cybersalt directly. We respond to every report &mdash; this plugin is actively maintained on production sites we manage."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Attribution"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="The SiteGround cache communication protocol (UNIX socket API for cache purging) was learned by studying SiteGround's Speed Optimizer plugin for WordPress (GPLv3). No WordPress code was copied; this is an independent Joomla implementation written from scratch using Joomla 5's native plugin API. Not affiliated with or endorsed by SiteGround."
