; Logging & debug settings
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING="Enable File Logging"
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING_DESC="Write cache operations to a log file in your Joomla logs directory. Useful for troubleshooting. Disable in production for best performance."
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING="Verbose Mode"
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING_DESC="Log every frontend page visit including cache-enabled responses. When off, only cache bypasses, purges, errors, and content changes are logged. Turn on temporarily for troubleshooting, then turn off for production.&lt;br/&gt;&lt;br/&gt;&lt;strong&gt;Privacy / GDPR:&lt;/strong&gt; verbose mode records the URL path of every frontend request to the log file. URLs may incidentally contain personal data (search queries, member-only paths). Disable verbose mode in production unless your privacy policy and retention controls cover this."
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG="Enable Debug Panel"
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG_DESC="Show a debug panel at the bottom of every admin page displaying cache operations that occurred during the current request. Only visible to administrators."
PLG_SYSTEM_SGCACHE_LOG_FILE="Log Filename"
PLG_SYSTEM_SGCACHE_LOG_FILE_DESC="Name of the log file. It's stored as this name plus .php in Joomla's log folder (Global Configuration &rarr; System &rarr; Path to Log Folder), and starts with a line that stops a browser from reading it. Default: sgcache.log"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE="Max Log Size (MB)"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE_DESC="When the log file exceeds this size, it will be rotated. Keeps the last 5 rotated files. Default: 5 MB."
PLG_SYSTEM_SGCACHE_LOG_VIEWER="Log Viewer"
