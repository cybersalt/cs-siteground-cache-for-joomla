; Advanced settings
PLG_SYSTEM_SGCACHE_VARY_USER_AGENT="Vary by User Agent"
PLG_SYSTEM_SGCACHE_VARY_USER_AGENT_DESC="Add Vary: User-Agent header to serve different cached versions for mobile and desktop browsers."
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN="Cache for Logged-in Users"
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN_DESC="Allow caching for logged-in users. WARNING: May show incorrect content to users. Only enable if your site serves the same content to all users."
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE="Suppress Session Cookie on Cacheable Pages"
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE_DESC="Strip Joomla's Set-Cookie response header on cacheable anonymous GET requests so SiteGround's edge can actually cache them. Without this, SiteGround skips caching every guest hit because of the session cookie (X-Proxy-Cache-Info: SKIP_CACHE_SET_COOKIE). Excluded URLs and components are untouched and still get full sessions for forms/CSRF. Leave ON unless a third-party plugin needs to set cookies on cacheable anonymous pages."
PLG_SYSTEM_SGCACHE_PURGE_BUTTON="Manual Cache Purge"
PLG_SYSTEM_SGCACHE_PURGE_BUTTON_DESC="Click to manually purge all SiteGround cache."

