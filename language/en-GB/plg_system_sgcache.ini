PLG_SYSTEM_SGCACHE="System - Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_DESCRIPTION="<strong>By <a href='https://www.cybersalt.com/joomla-extensions/siteground-cache' target='_blank' rel='noopener'>Cybersalt</a>.</strong> Integrates Joomla with SiteGround's server-side caching system. Automatically purges dynamic cache when content changes, sets the right HTTP cache headers, and suppresses session cookies on cacheable anonymous responses so SiteGround's edge can actually cache them.<br/><br/><small>Cache communication protocol learned from SiteGround's <a href='https://wordpress.org/plugins/sg-cachepress/' target='_blank' rel='noopener'>Speed Optimizer</a> plugin for WordPress (GPLv3). No code was copied; this is an independent Joomla implementation. Not affiliated with or endorsed by SiteGround.</small>"

