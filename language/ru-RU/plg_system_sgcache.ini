PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE_LABEL="Сторож главной страницы"
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE="Запланированная задача может каждые несколько минут загружать вашу главную страницу и, если она вернётся не как веб-страница, очищать кэш SiteGround и отправлять вам письмо. Установщик добавляет её неопубликованной: перейдите в <a href='index.php?option=com_scheduler&amp;view=tasks'>Система &rarr; Запланированные задачи</a>, откройте <em>SiteGround Cache: сторож главной страницы</em> и опубликуйте её."
