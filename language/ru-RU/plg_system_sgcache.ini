; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Добро пожаловать в Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="Системный плагин для Joomla 5 / 6, интегрирующийся с серверным динамическим кэшем SiteGround. Более быстрая загрузка страниц, автоматическая очистка кэша при изменении контента и правильные HTTP-заголовки, чтобы edge-сервер SiteGround действительно кэшировал ваши страницы."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Быстрый старт"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Убедитесь, что SiteGround обнаружен.</strong> Откройте вкладку <em>Настройки Cache</em> и посмотрите на панель состояния вверху. На плитке Хостинг SiteGround должно быть 'Обнаружен'. Если нет, плагин ничего не будет делать &mdash; он работает только на серверах SiteGround."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Не меняйте значения по умолчанию.</strong> Динамический кэш, автоочистка и подавление cookie сессии по умолчанию ВКЛЮЧЕНЫ. Это правильная настройка почти для любого сайта."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Проверьте, что всё работает.</strong> Откройте сайт в приватном окне (инкогнито) и проверьте заголовки ответа. Вы должны увидеть <code>X-Cache-Enabled: True</code> и <em>не</em> увидеть <code>Set-Cookie</code>. Проверьте ещё раз через минуту &mdash; <code>X-Proxy-Cache: HIT</code> означает, что SiteGround теперь отдаёт страницу из кэша."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Следите за ростом доли кэша.</strong> Откройте панель SiteGround и наблюдайте, как доля кэша растёт в течение следующих 24&ndash;48 часов, по мере того как edge-сервер заполняется кэшированными страницами."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Советы"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Страницы с Convert Forms, RSForm! Pro или модулем входа кэшируются без токена безопасности формы; браузер каждого посетителя получает собственный токен при использовании формы. Страницы с любой другой формой Joomla распознаются и не кэшируются, поэтому их формы продолжают работать. Нажмите <em>Проверить мою главную страницу</em> на вкладке Настройки Cache, чтобы узнать, кэшируются ли ваши страницы, а если нет, то почему. Используйте <em>Исключённые URL</em> или <em>Исключённые пункты меню</em> только для других страниц, которые никогда не должны кэшироваться, например страниц, показывающих каждому посетителю разное содержимое."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Используйте кнопку <em>Очистить кэш SiteGround</em> в верхней панели админки Joomla (включена по умолчанию) для полной очистки кэша одним кликом, когда вносите крупные изменения контента. Она очищает только кэш SiteGround; собственная функция Joomla Очистить кэш этого не делает."
PLG_SYSTEM_SGCACHE_GS_TIP_3="При устранении неполадок включите журналирование на вкладке Журналирование. Встроенная панель показывает каждое решение о кэшировании в реальном времени. В продакшене отключайте его, чтобы всё работало быстро."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="О плагине"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache является бесплатным расширением с открытым исходным кодом для Joomla 5 / 6, созданным и поддерживаемым Cybersalt. Оно устраняет пробел в кэшировании SiteGround, из-за которого каждый сайт Joomla на SiteGround работал без кэша &mdash; до сих пор."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Ресурсы"
