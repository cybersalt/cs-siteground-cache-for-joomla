PLG_SYSTEM_SGCACHE_SESSION_HANDLING_NOTE="<strong>Обработка сессий.</strong> Эти два параметра определяют, сможет ли SiteGround действительно кэшировать анонимный трафик. Значения по умолчанию (<em>Кэш для авторизованных пользователей: Нет</em>, <em>Подавлять cookie сессии: Да</em>) подходят почти для любого сайта."

