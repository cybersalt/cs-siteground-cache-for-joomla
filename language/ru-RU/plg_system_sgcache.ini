; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Включить динамический кэш"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Включает заголовки динамического кэширования SiteGround. Страницы будут помечены как кэшируемые для обратного прокси-сервера SiteGround."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Автоочистка при изменении контента"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Автоматически очищать связанные записи кэша при сохранении, удалении или изменении состояния контента."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Порог очистки"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Если количество URL, требующих очистки, превышает это число, будет выполнена полная очистка кэша вместо индивидуальной. По умолчанию: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="Исключённые URL"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="Один путь URL на строку (относительно корня сайта), который никогда не должен кэшироваться. Простой путь охватывает и всё, что с него начинается: <code>/members</code> охватывает <code>/members/profile</code>. Используйте <code>*</code> для любого текста (<code>/shop/*/checkout</code>), завершите строку символом <code>$</code>, чтобы совпадал только этот путь (<code>/about$</code>), и добавьте <code>?</code>, чтобы учитывалась и строка запроса (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Исключённые пункты меню"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Страницы, показываемые под этими пунктами меню, никогда не кэшируются. Проще, чем угадывать пути URL. Joomla также относит к пункту меню страницы, открытые через него, например статьи блога категории."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Кэшируемые параметры запроса"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Страницы со строкой запроса не кэшируются, за исключением маркетинговых параметров отслеживания (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), которые не меняют страницу. Укажите здесь другие параметры, по одному на строку, чтобы такие страницы тоже кэшировались, например <code>start</code> или <code>limitstart</code> для постраничной навигации. Параметры <code>format</code>, <code>tmpl</code> и <code>task</code> никогда не кэшируются, как и страница, URL которой сочетает указанный параметр с параметром отслеживания: SiteGround сохранил бы её под голым путём."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="Исключённые User Agent"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="Один фрагмент текста на строку, например <code>Feedly</code> или <code>UptimeRobot</code>. Если user agent посетителя содержит его (регистр не важен), страница, сформированная для него, не сохраняется в кэше. Примечание: SiteGround всё равно может отдать ему копию, закэшированную для кого-то другого, если не включён параметр <em>Разделение по User Agent</em> (вкладка Расширенные настройки)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Страницы с формами"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Форма Joomla содержит токен безопасности, принадлежащий сессии посетителя, поэтому кэшированную копию нельзя просто отдавать всем. При включённом параметре <em>Кэшировать страницы с формами</em> плагин кэширует страницу без токена, а браузер посетителя получает собственный токен при первом использовании формы. Формы, не отмеченные ниже, и формы, которые плагин не распознаёт, оставляют свою страницу некэшируемой, как и раньше."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Кэшировать страницы с формами"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Кэшировать страницы, на которых есть только формы отмеченных ниже типов; токен каждого посетителя получается скриптом. Требуется JavaScript в браузере посетителя (Convert Forms он нужен в любом случае). После включения отправьте каждую форму один раз из приватного окна, чтобы проверить её. Выключите, чтобы все страницы с формами оставались некэшируемыми."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Формы, которые можно кэшировать"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Типы форм, которым, как известно, от сессии посетителя не нужно ничего, кроме токена."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Модуль входа Joomla"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Другие формы (маркеры)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="Для других форм, которым нужен только токен: один фрагмент текста на строку, встречающийся в HTML формы, например <code>id=&quot;newsletter&quot;</code>. Добавляйте форму сюда, только убедившись, что она не хранит в сессии посетителя ничего другого (ответ на капчу, корзину, состояние многошаговой формы)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Исключённые компоненты"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Выберите компоненты, страницы которых никогда не должны кэшироваться SiteGround."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Показать кнопку очистки в админке"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Отображать кнопку 'Очистить кэш SiteGround' в верхней панели административной области Joomla, видимую на каждой странице. Она очищает только серверный кэш SiteGround. Собственная функция Joomla Система &rarr; Очистить кэш и кнопки очистки кэша оптимизаторов, таких как JCH Optimize, не затрагивают кэш SiteGround, а эта кнопка не затрагивает их кэш."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Режим кнопки"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Простой: одна кнопка, очищающая весь кэш. Dropdown: разделённая кнопка с 'Очистить всё' и пользовательскими путями."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Простой - Очистить всё"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Dropdown - Очистить всё + Пользовательские пути"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Пользовательские пути очистки"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="Одна запись на строку в формате: Метка|/путь. Они отображаются как опции в dropdown. Пример: Блог|/blog или Новости|/news"

; Toolbar button labels
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE="Очистить кэш SiteGround"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_TITLE="Очищает серверный кэш SiteGround (не собственный кэш Joomla)"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_ALL="Очистить весь кэш"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_LABEL="Очистить определённый путь"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGING="Очистка..."

; Logging & debug settings
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING="Включить журналирование в файл"
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING_DESC="Записывать операции кэширования в файл журнала в каталоге логов Joomla. Полезно для устранения неполадок. Отключите в продакшене для лучшей производительности."
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING="Подробный режим"
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING_DESC="Записывать каждое посещение фронтенд-страницы, включая ответы с включённым кэшированием. При отключении записываются только обходы кэша, очистки, ошибки и изменения контента. Включайте временно для устранения неполадок, затем отключайте в продакшене."
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG="Включить панель Debug"
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG_DESC="Показывать панель отладки внизу каждой страницы администрирования, отображающую операции кэширования, произошедшие во время текущего запроса. Видна только администраторам."
PLG_SYSTEM_SGCACHE_LOG_FILE="Имя файла журнала"
PLG_SYSTEM_SGCACHE_LOG_FILE_DESC="Имя файла журнала. Он хранится под этим именем с добавлением .php в каталоге логов Joomla (Общие настройки &rarr; Система &rarr; Путь к каталогу логов) и начинается со строки, которая не даёт браузеру его прочитать. По умолчанию: sgcache.log"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE="Макс. размер журнала (МБ)"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE_DESC="Когда файл журнала превысит этот размер, он будет ротирован. Хранятся последние 5 ротированных файлов. По умолчанию: 5 МБ."
PLG_SYSTEM_SGCACHE_LOG_VIEWER="Просмотр журнала"
PLG_SYSTEM_SGCACHE_LOG_VIEWER_DESC="Просмотр, скачивание, тестирование или очистка журнала кэширования."

