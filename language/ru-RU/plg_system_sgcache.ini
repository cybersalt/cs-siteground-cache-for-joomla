PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_DESC="Загружает главную страницу (и дополнительные пути) от имени посетителя. Если какая-то из них вернётся не как HTML-страница, очищает кэш SiteGround, проверяет снова и отправляет отчёт по электронной почте."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_SITE_URL_LABEL="Адрес сайта"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_SITE_URL_DESC="Адрес главной страницы сайта, например https://www.example.com/. Заполняется автоматически; он нужен, потому что задача, запущенная из командной строки (cli/joomla.php), не может сама определить адрес сайта."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_NOTIFY_EMAIL_LABEL="Отправлять отчёты на"
