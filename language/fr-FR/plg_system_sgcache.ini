; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Activer le cache dynamique"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Active les en-têtes de cache dynamique de SiteGround. Les pages seront marquées comme cacheables pour le proxy inverse de SiteGround."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Purge automatique au changement de contenu"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Purger automatiquement les entrées de cache associées lorsque le contenu est enregistré, supprimé ou que son état est modifié."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Seuil de purge"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Si plus de ce nombre d'URL's doivent être purgées, un vidage complet du cache sera effectué au lieu d'une purge individuelle. Par défaut : 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="URL's exclues"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="Un chemin d'URL par ligne (relatif à la racine du site) qui ne doit jamais être mis en cache. Un chemin simple couvre aussi tout ce qui commence par lui : <code>/members</code> couvre <code>/members/profile</code>. Utilisez <code>*</code> pour n'importe quel texte (<code>/shop/*/checkout</code>), terminez une ligne par <code>$</code> pour ne correspondre qu'à ce chemin exact (<code>/about$</code>), et incluez <code>?</code> pour tenir compte aussi de la chaîne de requête (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Éléments de menu exclus"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Les pages affichées sous ces éléments de menu ne sont jamais mises en cache. Plus simple que de deviner des chemins d'URL. Joomla utilise aussi un élément de menu pour les pages atteintes par son intermédiaire, comme les articles d'un blog de catégorie."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Paramètres de requête cacheables"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Les pages avec une chaîne de requête ne sont pas mises en cache, sauf pour les paramètres de suivi marketing (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), qui ne modifient pas la page. Indiquez ici d'autres paramètres, un par ligne, pour que ces pages puissent aussi être mises en cache, par exemple <code>start</code> ou <code>limitstart</code> pour la pagination. <code>format</code>, <code>tmpl</code> et <code>task</code> ne sont jamais mis en cache, pas plus qu'une page dont l'URL mélange un paramètre de la liste avec un paramètre de suivi : SiteGround la stockerait sous le chemin seul."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="User Agents exclus"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="Un texte par ligne, par exemple <code>Feedly</code> ou <code>UptimeRobot</code>. Lorsque le user agent d'un visiteur le contient (sans tenir compte de la casse), la page générée pour lui n'est pas stockée dans le cache. Remarque : SiteGround peut tout de même lui servir une copie mise en cache pour quelqu'un d'autre, sauf si <em>Varier selon le User Agent</em> est activé (onglet Paramètres avancés)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Pages avec formulaires"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Un formulaire Joomla contient un jeton de sécurité lié à la session du visiteur, une copie en cache ne peut donc pas simplement être partagée. Avec <em>Mettre en cache les pages avec formulaires</em> activé, le plugin met la page en cache sans le jeton et le navigateur du visiteur récupère son propre jeton la première fois qu'il utilise le formulaire. Les formulaires non cochés ci-dessous, et ceux que le plugin ne reconnaît pas, laissent leur page hors cache comme avant."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Mettre en cache les pages avec formulaires"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Met en cache les pages dont les seuls formulaires sont des types cochés ci-dessous, le jeton de chaque visiteur étant récupéré par script. Nécessite JavaScript dans le navigateur du visiteur (Convert Forms en a besoin de toute façon). Après l'activation, envoyez chaque formulaire une fois dans une fenêtre privée pour le vérifier. Désactivez l'option pour garder hors cache toute page contenant un formulaire."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Formulaires pouvant être mis en cache"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Types de formulaires connus pour n'avoir besoin de rien d'autre dans la session du visiteur que le jeton."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Module de connexion Joomla"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Autres formulaires (marqueurs)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="Pour les autres formulaires qui n'ont besoin que du jeton : un texte par ligne qui figure dans le HTML du formulaire, par exemple <code>id=&quot;newsletter&quot;</code>. N'ajoutez un formulaire ici qu'après avoir vérifié qu'il ne conserve rien d'autre dans la session du visiteur (une réponse de captcha, un panier, un état multi-étapes)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Composants exclus"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Sélectionnez les composants dont les pages ne doivent jamais être mises en cache par SiteGround."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Afficher le bouton de purge dans l'administration"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Affiche un bouton 'Purger le cache SiteGround' dans la barre supérieure de l'espace d'administration Joomla, visible sur chaque page. Il vide uniquement le cache serveur de SiteGround. Le menu Système &rarr; Nettoyer le cache de Joomla, ainsi que les boutons de vidage de cache des optimiseurs comme JCH Optimize, ne touchent pas au cache de SiteGround, et ce bouton ne touche pas au leur."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Mode du bouton"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Simple : un bouton qui purge tout le cache. Dropdown : un bouton divisé avec 'Tout purger' plus des options de chemins personnalisés."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Simple - Tout purger"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Dropdown - Tout purger + Chemins personnalisés"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Chemins de purge personnalisés"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="Une entrée par ligne au format : Libellé|/chemin. Celles-ci apparaissent comme options dans le dropdown. Exemple : Blog|/blog ou Section actualités|/actualites"

; Toolbar button labels
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE="Purger le cache SiteGround"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_TITLE="Vide le cache serveur de SiteGround (pas le cache propre à Joomla)"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_ALL="Purger tout le cache"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_LABEL="Purger un chemin spécifique"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGING="Purge en cours..."

; Logging & debug settings
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING="Activer la journalisation fichier"
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING_DESC="Écrit les opérations de cache dans un fichier journal dans le répertoire de journaux de Joomla. Utile pour le dépannage. Désactivez en production pour de meilleures performances."
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING="Mode détaillé"
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING_DESC="Journalise chaque visite de page frontend y compris les réponses avec cache activé. Lorsque désactivé, seuls les contournements de cache, purges, erreurs et changements de contenu sont journalisés. Activez temporairement pour le dépannage, puis désactivez pour la production."
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG="Activer le panneau de debug"
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG_DESC="Affiche un panneau de debug en bas de chaque page d'administration montrant les opérations de cache effectuées pendant la requête en cours. Visible uniquement par les administrateurs."
PLG_SYSTEM_SGCACHE_LOG_FILE="Nom du fichier journal"
PLG_SYSTEM_SGCACHE_LOG_FILE_DESC="Nom du fichier journal. Il est enregistré sous ce nom suivi de .php dans le dossier des journaux de Joomla (Configuration globale &rarr; Système &rarr; Chemin du dossier des journaux), et commence par une ligne qui empêche un navigateur de le lire. Par défaut : sgcache.log"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE="Taille maximale du journal (Mo)"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE_DESC="Lorsque le fichier journal dépasse cette taille, il sera soumis à une rotation. Conserve les 5 derniers fichiers de rotation. Par défaut : 5 Mo."
PLG_SYSTEM_SGCACHE_LOG_VIEWER="Visionneuse de journal"
PLG_SYSTEM_SGCACHE_LOG_VIEWER_DESC="Afficher, télécharger, tester ou effacer le journal de cache."

