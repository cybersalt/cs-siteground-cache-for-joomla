; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Bienvenue dans Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="Un plugin système pour Joomla 5 / 6 qui s'intègre au cache dynamique côté serveur de SiteGround. Des pages plus rapides, une purge automatique du cache lors des modifications de contenu, et les bons en-têtes HTTP pour que l'edge de SiteGround mette réellement vos pages en cache."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Démarrage rapide"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Vérifiez que SiteGround est détecté.</strong> Ouvrez l'onglet <em>Paramètres du cache</em> et regardez le panneau d'état en haut. La tuile Hébergement SiteGround doit indiquer 'Détecté'. Sinon, ce plugin ne fera rien &mdash; il ne fonctionne que sur les serveurs SiteGround."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Gardez les valeurs par défaut.</strong> Cache dynamique, purge automatique et Supprimer le cookie de session sont tous ACTIVÉS par défaut. C'est la bonne configuration pour presque tous les sites."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Vérifiez que cela fonctionne.</strong> Ouvrez votre site dans une fenêtre de navigation privée et vérifiez les en-têtes de réponse. Vous devriez voir <code>X-Cache-Enabled: True</code> et <em>aucun</em> <code>Set-Cookie</code>. Vérifiez à nouveau après une minute &mdash; <code>X-Proxy-Cache: HIT</code> signifie que SiteGround sert désormais depuis le cache."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Regardez le taux de cache grimper.</strong> Ouvrez votre tableau de bord SiteGround et observez le taux de cache s'améliorer au cours des 24&ndash;48 prochaines heures, à mesure que l'edge se remplit de pages en cache."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Astuces"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Les pages contenant Convert Forms, RSForm! Pro ou le module de connexion sont mises en cache sans le jeton de sécurité du formulaire ; le navigateur de chaque visiteur récupère le sien lorsqu'il utilise le formulaire. Les pages contenant tout autre formulaire Joomla sont détectées et laissées hors cache, afin que leurs formulaires continuent de fonctionner. Cliquez sur <em>Tester ma page d'accueil</em> dans l'onglet Paramètres du cache pour voir si vos pages sont mises en cache, et pourquoi si ce n'est pas le cas. N'utilisez <em>URL's exclues</em> ou <em>Éléments de menu exclus</em> que pour d'autres pages qui ne doivent jamais être mises en cache, comme les pages qui affichent un contenu différent à chaque visiteur."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Utilisez le bouton <em>Purger le cache SiteGround</em> dans la barre supérieure de l'administration Joomla (activé par défaut) pour vider tout le cache en un clic chaque fois que vous publiez une modification de contenu importante. Il vide uniquement le cache de SiteGround ; la fonction Nettoyer le cache de Joomla ne le fait pas."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Activez la journalisation (onglet Journalisation) en cas de dépannage. Le tableau de bord intégré affiche chaque décision de cache en temps réel. Désactivez-la en production pour garder un site réactif."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="À propos de ce plugin"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache est une extension gratuite et open source pour Joomla 5 / 6, développée et maintenue par Cybersalt. Elle comble la lacune de mise en cache de SiteGround qui laissait tous les sites Joomla hébergés chez SiteGround fonctionner sans cache &mdash; jusqu'à maintenant."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Ressources"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="Autres extensions Joomla de Cybersalt"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="Code source sur GitHub"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Signaler un bug / Demander une fonctionnalité"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Support &amp; signalement de bugs"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="Si vous trouvez un bug ou avez une demande de fonctionnalité, ouvrez une issue sur GitHub ou contactez directement Cybersalt. Nous répondons à chaque signalement &mdash; ce plugin est activement maintenu sur des sites en production que nous gérons."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Attribution"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="Le protocole de communication du cache SiteGround (API de socket UNIX pour la purge du cache) a été appris en étudiant le plugin Speed Optimizer de SiteGround pour WordPress (GPLv3). Aucun code WordPress n'a été copié ; il s'agit d'une implémentation Joomla indépendante, écrite de zéro avec l'API de plugins native de Joomla 5. Non affilié à SiteGround ni approuvé par SiteGround."
PLG_SYSTEM_SGCACHE_ABOUT_LICENSE="Copyright (C) 2026 Cybersalt. Publié sous la licence GNU General Public License v2 ou ultérieure."
