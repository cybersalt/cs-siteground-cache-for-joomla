; Home page watchdog (System > Scheduled Tasks)
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE_LABEL="Surveillance de la page d'accueil"
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE="Une tâche planifiée peut récupérer votre page d'accueil toutes les quelques minutes et, si elle revient un jour sous une autre forme qu'une page web, purger le cache SiteGround et vous envoyer un e-mail. L'installateur l'ajoute non publiée : allez dans <a href='index.php?option=com_scheduler&amp;view=tasks'>Système &rarr; Tâches planifiées</a>, ouvrez <em>SiteGround Cache : surveillance de la page d'accueil</em> et publiez-la."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_TITLE="SiteGround Cache : surveillance de la page d'accueil"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_DESC="Récupère la page d'accueil (et les éventuels chemins supplémentaires) en tant que visiteur. Si l'une d'elles revient sous une autre forme qu'une page HTML, purge le cache SiteGround, vérifie à nouveau et envoie un rapport par e-mail."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_SITE_URL_LABEL="Adresse du site"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_SITE_URL_DESC="L'adresse de la page d'accueil du site, par exemple https://www.example.com/. Remplie automatiquement ; elle est nécessaire car une tâche lancée en ligne de commande (cli/joomla.php) ne peut pas déterminer seule l'adresse du site."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_NOTIFY_EMAIL_LABEL="Envoyer les rapports à"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_NOTIFY_EMAIL_DESC="Laissez vide pour utiliser l'adresse e-mail d'expéditeur du site (Configuration globale &rarr; Serveur &rarr; Mail)."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_EXTRA_PATHS_LABEL="Vérifier aussi ces chemins"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_EXTRA_PATHS_DESC="Un chemin par ligne, commençant par /, par exemple /blog. La page d'accueil est toujours vérifiée."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_SUBJECT="%s : le cache SiteGround a servi une page défectueuse"
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_INTRO="La surveillance SiteGround Cache sur %1$s (%2$s) a récupéré ces pages en tant que visiteur et elles ne sont pas revenues comme des pages web normales :"
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_PURGED="Le cache SiteGround a été purgé."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_PURGE_FAILED="La purge du cache SiteGround a échoué. Utilisez le bouton Purger le cache SiteGround dans l'administration Joomla."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_FIXED="Après la purge, toutes les pages sont revenues normalement."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_STILL="Après la purge, celles-ci revenaient toujours incorrectes : %s. Vérifiez le site."
