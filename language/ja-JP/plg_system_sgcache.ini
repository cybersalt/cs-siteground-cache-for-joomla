PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="リソース"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="CybersaltのJoomla拡張機能をもっと見る"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="GitHubのソースコード"
