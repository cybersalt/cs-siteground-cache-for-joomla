PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="SiteGroundのcache通信プロトコル（cacheパージ用のUNIXソケットAPI）は、SiteGroundのWordPress用Speed Optimizerプラグイン（GPLv3）を調べて学びました。WordPressのコードはコピーしていません。これはJoomla 5のネイティブなプラグインAPIを使ってゼロから書かれた、独立したJoomla実装です。SiteGroundとの提携や承認はありません。"
