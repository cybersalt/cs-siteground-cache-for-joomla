; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="ダイナミックcacheを有効にする"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="SiteGroundダイナミックcacheヘッダーを有効にします。ページはSiteGroundのリバースプロキシでcache可能としてマークされます。"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="コンテンツ変更時の自動パージ"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="コンテンツの保存、削除、または状態変更時に関連するcacheエントリを自動的にパージします。"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="パージしきい値"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="パージが必要なURLの数がこの値を超えると、個別にパージする代わりにcache全体のフラッシュが実行されます。デフォルト：10。"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="除外URL"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="cacheしないURLパスを1行に1つ入力します（サイトルートからの相対パス）。単純なパスは、そのパスで始まるものすべてにも適用されます：<code>/members</code> は <code>/members/profile</code> にも適用されます。任意の文字列には <code>*</code> を使い（<code>/shop/*/checkout</code>）、そのパスだけに一致させるには行末に <code>$</code> を付け（<code>/about$</code>）、クエリ文字列も照合するには <code>?</code> を含めます（<code>/search?q=</code>）。"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="除外メニュー項目"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="これらのメニュー項目の下に表示されるページはcacheされません。URLパスを推測するより簡単です。Joomlaは、カテゴリーブログの記事など、メニュー項目を経由して表示されるページにもそのメニュー項目を使います。"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="cache可能なクエリパラメータ"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="クエリ文字列を含むページはcacheされません。ただし、ページ内容を変えないマーケティング用のトラッキングパラメータ（<code>utm_*</code>、<code>fbclid</code>、<code>gclid</code>...）は例外です。ほかのパラメータをここに1行に1つ入力すると、そのページもcacheできるようになります。例：ページ送り用の <code>start</code> や <code>limitstart</code>。<code>format</code>、<code>tmpl</code>、<code>task</code> は常にcacheされません。URLに登録済みのパラメータとトラッキングパラメータが混在するページもcacheされません：SiteGroundがそれをパラメータなしのパスで保存してしまうためです。"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="除外ユーザーエージェント"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="1行に1つ文字列を入力します。例：<code>Feedly</code> や <code>UptimeRobot</code>。訪問者のユーザーエージェントにその文字列が含まれる場合（大文字・小文字は区別しません）、その訪問者向けに生成されたページはcacheに保存されません。注意：<em>ユーザーエージェントで分類</em>（詳細設定タブ）がオンでない限り、SiteGroundはほかの人向けにcacheされたコピーをその訪問者に返すことがあります。"
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="フォームのあるページ"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Joomlaのフォームには訪問者のセッションに属するセキュリティトークンが含まれるため、cacheされたコピーをそのまま共有することはできません。<em>フォームのあるページをcacheする</em> をオンにすると、プラグインはトークンを除いた状態でページをcacheし、訪問者のブラウザがフォームを初めて使うときに自分用のトークンを取得します。下でチェックされていないフォームや、プラグインが認識できないフォームのページは、これまでどおりcacheされません。"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="フォームのあるページをcacheする"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="下でチェックした種類のフォームだけを含むページをcacheし、各訪問者のトークンはスクリプトで取得します。訪問者のブラウザでJavaScriptが必要です（Convert Formsはもともと必要です）。オンにした後、プライベートウィンドウで各フォームを一度送信して確認してください。オフにすると、フォームのあるページはすべてcacheされません。"
PLG_SYSTEM_SGCACHE_FORM_TYPES="cacheしてよいフォーム"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="トークン以外に訪問者のセッションを何も必要としないことがわかっているフォームの種類。"
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Joomlaログインモジュール"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="その他のフォーム（マーカー）"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="トークンだけを必要とするほかのフォーム用です：フォームのHTML内に現れる文字列を1行に1つ入力します。例：<code>id=&quot;newsletter&quot;</code>。ここに追加するのは、そのフォームが訪問者のセッションにほかの情報（captchaの答え、カート、複数ステップの状態）を保存しないことを確認してからにしてください。"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="除外コンポーネント"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="SiteGroundでcacheしないコンポーネントを選択してください。"

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="管理画面にパージボタンを表示"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Joomla管理画面の上部バーに「SiteGround cacheをパージ」ボタンを表示します（すべてのページで表示）。消去するのはSiteGroundのサーバーcacheだけです。Joomla自体の システム &rarr; キャッシュのクリア や、JCH Optimizeなどの最適化ツールのcacheクリアボタンはSiteGroundのcacheに影響せず、このボタンもそれらのcacheには影響しません。"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="ボタンモード"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="シンプル：すべてのcacheをパージする1つのボタン。ドロップダウン：「すべてパージ」とカスタムパスオプションを持つ分割ボタン。"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="シンプル - すべてパージ"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="ドロップダウン - すべてパージ + カスタムパス"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="カスタムパージパス"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="1行に1つ、ラベル|/パス の形式で入力してください。ドロップダウンのオプションとして表示されます。例：ブログ|/blog または ニュースセクション|/news"

; Toolbar button labels
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE="SiteGround cacheをパージ"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_TITLE="SiteGroundのサーバーcacheを消去します（Joomla自体のcacheではありません）"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_ALL="すべてのcacheをパージ"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_LABEL="特定パスのパージ"
