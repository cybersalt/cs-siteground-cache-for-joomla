PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="バグを見つけた場合や機能のリクエストがある場合は、GitHubでissueを作成するか、Cybersaltに直接ご連絡ください。すべての報告に対応します &mdash; このプラグインは、私たちが管理する本番サイトで積極的に保守されています。"
