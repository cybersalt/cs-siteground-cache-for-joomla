; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Cybersalt SiteGround Cacheへようこそ"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="SiteGroundのサーバーサイドのダイナミックcacheと連携する、Joomla 5 / 6用のシステムプラグインです。ページの高速表示、コンテンツ変更時のcache自動パージ、そしてSiteGroundのエッジが実際にページをcacheするための適切なHTTPヘッダーを提供します。"
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="クイックスタート"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>SiteGroundが検出されていることを確認します。</strong> <em>Cache設定</em> タブを開き、上部のステータスパネルを見てください。SiteGroundホスティングのタイルに「検出済み」と表示されているはずです。表示されていない場合、このプラグインは何もしません &mdash; SiteGroundのサーバーでのみ動作します。"
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>デフォルトのままにします。</strong> ダイナミックcache、自動パージ、セッションCookieの抑制は、すべてデフォルトでオンです。ほぼすべてのサイトに適した設定です。"
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>動作を確認します。</strong> プライベート/シークレットウィンドウでサイトを開き、レスポンスヘッダーを確認してください。<code>X-Cache-Enabled: True</code> があり、<code>Set-Cookie</code> が<em>ない</em>はずです。1分後にもう一度確認してください &mdash; <code>X-Proxy-Cache: HIT</code> は、SiteGroundがcacheから配信するようになったことを示します。"
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>cache率の上昇を見守ります。</strong> SiteGroundのダッシュボードを開き、エッジがcacheされたページで満たされるにつれて、今後24&ndash;48時間でcache率が向上するのを確認してください。"
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="ヒント"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Convert Forms、RSForm! Pro、またはログインモジュールのあるページは、フォームのセキュリティトークンを取り除いた状態でcacheされます。各訪問者のブラウザは、フォームを使うときに自分用のトークンを取得します。その他のJoomlaフォームがあるページは検出されてcacheされないため、フォームは引き続き動作します。Cache設定タブの <em>ホームページをテスト</em> をクリックすると、ページがcacheされているかどうか、されていない場合はその理由がわかります。<em>除外URL</em> や <em>除外メニュー項目</em> は、訪問者ごとに異なる内容を表示するページなど、決してcacheしてはいけないほかのページにだけ使ってください。"
PLG_SYSTEM_SGCACHE_GS_TIP_2="大きなコンテンツ変更を反映したときは、Joomla管理画面の上部バーにある <em>SiteGround cacheをパージ</em> ボタン（デフォルトで有効）で、ワンクリックでcache全体をフラッシュできます。消去するのはSiteGroundのcacheだけで、Joomla自体のキャッシュのクリアでは消去されません。"
PLG_SYSTEM_SGCACHE_GS_TIP_3="トラブルシューティング中はログタブでログをオンにしてください。インラインのダッシュボードに、cacheの判定がすべてリアルタイムで表示されます。本番環境では動作を軽く保つためにオフにしてください。"

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="このプラグインについて"
