PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE="Sessiecookie onderdrukken op cachebare pagina's"
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE_DESC="Verwijder Joomla's Set-Cookie-responseheader bij cachebare anonieme GET-verzoeken, zodat de edge van SiteGround ze echt kan cachen. Zonder deze optie slaat SiteGround het cachen van elk gastbezoek over vanwege de sessiecookie (X-Proxy-Cache-Info: SKIP_CACHE_SET_COOKIE). Uitgesloten URL's en componenten blijven ongemoeid en krijgen nog steeds volledige sessies voor formulieren/CSRF. Laat AAN staan, tenzij een plugin van derden cookies moet plaatsen op cachebare anonieme pagina's."
