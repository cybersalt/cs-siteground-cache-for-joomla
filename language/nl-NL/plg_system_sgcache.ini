; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Welkom bij Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="Een systeemplugin voor Joomla 5 / 6 die integreert met de server-side dynamische cache van SiteGround. Krijg snellere laadtijden, automatisch wissen van de cache bij inhoudswijzigingen en de juiste HTTP-headers, zodat de edge van SiteGround uw pagina's echt cachet."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Snel aan de slag"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Controleer of SiteGround is gedetecteerd.</strong> Open het tabblad <em>Cache</em> en bekijk het statuspaneel bovenaan. De tegel SiteGround-hosting moet 'Gedetecteerd' tonen. Zo niet, dan doet deze plugin niets &mdash; hij werkt alleen op SiteGround-servers."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Laat de standaardinstellingen staan.</strong> Dynamische cache, Automatisch wissen en Sessiecookie onderdrukken staan standaard allemaal AAN. Dat is de juiste instelling voor vrijwel elke site."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Controleer of het werkt.</strong> Open uw site in een privé-/incognitovenster en bekijk de responseheaders. U zou <code>X-Cache-Enabled: True</code> moeten zien en <em>geen</em> <code>Set-Cookie</code>. Controleer na een minuut opnieuw &mdash; <code>X-Proxy-Cache: HIT</code> betekent dat SiteGround nu vanuit de cache serveert."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Zie de cache-ratio stijgen.</strong> Ga naar uw SiteGround-dashboard en zie de cache-ratio de komende 24&ndash;48 uur verbeteren naarmate de edge zich vult met gecachete pagina's."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Tips"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Pagina's met Convert Forms, RSForm! Pro of de inlogmodule worden gecachet zonder het beveiligingstoken van het formulier; de browser van elke bezoeker haalt een eigen token op wanneer die het formulier gebruikt. Pagina's met een ander Joomla-formulier worden gedetecteerd en niet gecachet, zodat hun formulieren blijven werken. Klik op <em>Mijn startpagina testen</em> op het tabblad Cache om te zien of uw pagina's gecachet worden, en zo niet, waarom niet. Gebruik <em>Uitgesloten URL's</em> of <em>Uitgesloten menu-items</em> alleen voor andere pagina's die nooit gecachet mogen worden, zoals pagina's die elke bezoeker andere inhoud tonen."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Gebruik de knop <em>SiteGround-cache wissen</em> in de bovenste balk van het Joomla-beheer (standaard ingeschakeld) om met één klik de volledige cache te legen wanneer u een grote inhoudswijziging doorvoert. Deze wist alleen de cache van SiteGround; Joomla's eigen Cache wissen doet dat niet."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Schakel het tabblad Logboek in als u problemen oplost. Het ingebouwde dashboard toont elke cachebeslissing in realtime. Schakel het uit in productie om alles vlot te houden."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="Over deze plugin"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache is een gratis, open-source extensie voor Joomla 5 / 6, gebouwd en onderhouden door Cybersalt. Het dicht het gat in de SiteGround-caching waardoor elke Joomla-site op SiteGround ongecachet draaide &mdash; tot nu."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Bronnen"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="Meer Joomla-extensies van Cybersalt"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="Broncode op GitHub"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Een bug melden / Een functie aanvragen"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Ondersteuning &amp; bugmeldingen"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="Als u een bug vindt of een functieverzoek hebt, open dan een issue op GitHub of neem rechtstreeks contact op met Cybersalt. We reageren op elke melding &mdash; deze plugin wordt actief onderhouden op productiesites die wij beheren."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Naamsvermelding"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="Het cache-communicatieprotocol van SiteGround (UNIX-socket-API voor het wissen van de cache) is geleerd door de Speed Optimizer-plugin van SiteGround voor WordPress (GPLv3) te bestuderen. Er is geen WordPress-code gekopieerd; dit is een onafhankelijke Joomla-implementatie, vanaf nul geschreven met de native plugin-API van Joomla 5. Niet gelieerd aan of goedgekeurd door SiteGround."
PLG_SYSTEM_SGCACHE_ABOUT_LICENSE="Copyright (C) 2026 Cybersalt. Uitgebracht onder de GNU General Public License v2 of later."
