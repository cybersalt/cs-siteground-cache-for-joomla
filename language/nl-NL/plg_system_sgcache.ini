PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_NOTIFY_EMAIL_DESC="Laat leeg om het afzenderadres van de site te gebruiken (Algemene configuratie &rarr; Server &rarr; E-mail)."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_EXTRA_PATHS_LABEL="Controleer ook deze paden"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_EXTRA_PATHS_DESC="Eén pad per regel, beginnend met /, bijvoorbeeld /blog. De startpagina wordt altijd gecontroleerd."
