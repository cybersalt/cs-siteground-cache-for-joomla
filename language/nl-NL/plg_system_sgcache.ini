; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Dynamische cache inschakelen"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Schakel dynamische cache-headers van SiteGround in. Pagina's worden gemarkeerd als cachebaar voor de reverse proxy van SiteGround."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Automatisch wissen bij inhoudswijziging"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Wis automatisch gerelateerde cache-items wanneer inhoud wordt opgeslagen, verwijderd of de status wordt gewijzigd."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Wisdrempel"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Als meer dan dit aantal URL's gewist moeten worden, wordt een volledige cache-flush uitgevoerd in plaats van individueel wissen. Standaard: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="Uitgesloten URL's"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="Eén URL-pad per regel (relatief ten opzichte van de siteroot) dat nooit gecachet mag worden. Een gewoon pad geldt ook voor alles wat ermee begint: <code>/members</code> geldt ook voor <code>/members/profile</code>. Gebruik <code>*</code> voor willekeurige tekst (<code>/shop/*/checkout</code>), eindig een regel met <code>$</code> om alleen dat pad te matchen (<code>/about$</code>) en neem <code>?</code> op om ook de querystring te matchen (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Uitgesloten menu-items"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Pagina's die onder deze menu-items worden getoond, worden nooit gecachet. Makkelijker dan URL-paden raden. Joomla gebruikt ook een menu-item voor pagina's die via dat item worden bereikt, zoals de artikelen van een categorieblog."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Cachebare queryparameters"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Pagina's met een querystring worden niet gecachet, behalve bij marketing-trackingparameters (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), die de pagina niet veranderen. Zet hier andere parameters, één per regel, zodat ook die pagina's gecachet kunnen worden, bijvoorbeeld <code>start</code> of <code>limitstart</code> voor paginering. <code>format</code>, <code>tmpl</code> en <code>task</code> worden nooit gecachet, en ook een pagina waarvan de URL een vermelde parameter met een trackingparameter combineert niet: SiteGround zou die onder het kale pad opslaan."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="Uitgesloten user agents"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="Eén stuk tekst per regel, bijvoorbeeld <code>Feedly</code> of <code>UptimeRobot</code>. Als de user agent van een bezoeker die tekst bevat (hoofdletters maken niet uit), wordt de pagina die voor die bezoeker is gegenereerd niet in de cache opgeslagen. Let op: SiteGround kan zo'n bezoeker nog steeds een kopie geven die voor iemand anders is gecachet, tenzij <em>Variëren op User Agent</em> aan staat (tabblad Geavanceerd)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Pagina's met formulieren"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Een Joomla-formulier bevat een beveiligingstoken dat bij de sessie van de bezoeker hoort, dus een gecachete kopie kan niet zomaar gedeeld worden. Met <em>Pagina's met formulieren cachen</em> aan cachet de plugin de pagina zonder het token, en haalt de browser van de bezoeker een eigen token op zodra die het formulier voor het eerst gebruikt. Formulieren die hieronder niet zijn aangevinkt, en formulieren die de plugin niet herkent, laten hun pagina zoals voorheen ongecachet."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Pagina's met formulieren cachen"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Cache pagina's waarvan de enige formulieren van de hieronder aangevinkte soorten zijn; het token van elke bezoeker wordt via een script opgehaald. Vereist JavaScript in de browser van de bezoeker (Convert Forms heeft dat toch al nodig). Verstuur na het inschakelen elk formulier één keer in een privévenster om het te controleren. Schakel uit om elke pagina met een formulier ongecachet te laten."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Formulieren die gecachet mogen worden"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Formuliertypen waarvan bekend is dat ze niets uit de sessie van de bezoeker nodig hebben behalve het token."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Joomla-inlogmodule"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Andere formulieren (markeringen)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="Voor andere formulieren die alleen het token nodig hebben: één stuk tekst per regel dat in de HTML van het formulier voorkomt, zoals <code>id=&quot;newsletter&quot;</code>. Voeg een formulier hier pas toe nadat u hebt gecontroleerd dat het niets anders in de sessie van de bezoeker bewaart (een captcha-antwoord, een winkelwagen, de stand van een formulier met meerdere stappen)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Uitgesloten componenten"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Selecteer componenten waarvan de pagina's nooit door SiteGround gecachet mogen worden."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Wisknop tonen in beheer"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Toon een knop 'SiteGround-cache wissen' in de bovenste balk van het Joomla-beheerdersgebied, zichtbaar op elke pagina. Deze wist alleen de servercache van SiteGround. Joomla's eigen Systeem &rarr; Cache wissen en de knoppen om de cache te legen van optimalisatietools zoals JCH Optimize raken de cache van SiteGround niet aan, en deze knop raakt die van hen niet aan."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Knopmodus"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Eenvoudig: één knop die alle cache wist. Dropdown: een gesplitste knop met 'Alles wissen' plus aangepaste padopties."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Eenvoudig - Alles wissen"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Dropdown - Alles wissen + Aangepaste paden"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Aangepaste wispaden"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="Eén item per regel in het formaat: Label|/pad. Deze verschijnen als opties in de dropdown. Voorbeeld: Blog|/blog of Nieuwssectie|/nieuws"

