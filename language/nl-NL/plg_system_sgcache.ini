PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE_LABEL="Bewaking van de startpagina"
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE="Een geplande taak kan uw startpagina om de paar minuten ophalen en, als die ooit terugkomt als iets anders dan een webpagina, de SiteGround-cache wissen en u een e-mail sturen. Het installatieprogramma voegt de taak ongepubliceerd toe: ga naar <a href='index.php?option=com_scheduler&amp;view=tasks'>Systeem &rarr; Geplande taken</a>, open <em>SiteGround Cache: bewaking van de startpagina</em> en publiceer de taak."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_TITLE="SiteGround Cache: bewaking van de startpagina"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_DESC="Haalt de startpagina (en eventuele extra paden) op als bezoeker. Als er een terugkomt als iets anders dan een HTML-pagina, wordt de SiteGround-cache gewist, opnieuw gecontroleerd en een rapport gemaild."
