PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_SITE_URL_DESC="Het adres van de startpagina van de site, bijvoorbeeld https://www.example.com/. Wordt voor u ingevuld; het is nodig omdat een taak die vanaf de opdrachtregel wordt uitgevoerd (cli/joomla.php) het adres van de site niet zelf kan bepalen."
