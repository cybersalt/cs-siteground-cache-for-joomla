PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING="Uitgebreide modus"
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING_DESC="Log elk frontend-paginabezoek inclusief cache-ingeschakelde antwoorden. Wanneer uitgeschakeld, worden alleen cache-omzeilingen, wisacties, fouten en inhoudswijzigingen gelogd. Schakel tijdelijk in voor probleemoplossing, schakel daarna uit voor productie."
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG="Debugpaneel inschakelen"
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG_DESC="Toon een debugpaneel onderaan elke beheerpagina met cache-bewerkingen die tijdens het huidige verzoek zijn uitgevoerd. Alleen zichtbaar voor beheerders."
PLG_SYSTEM_SGCACHE_LOG_FILE="Logbestandsnaam"
PLG_SYSTEM_SGCACHE_LOG_FILE_DESC="Naam van het logbestand. Het wordt opgeslagen onder deze naam plus .php in de logmap van Joomla (Algemene configuratie &rarr; Systeem &rarr; Pad naar logmap) en begint met een regel die voorkomt dat een browser het kan lezen. Standaard: sgcache.log"
