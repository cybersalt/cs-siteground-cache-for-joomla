; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Dinamik Cache'i Etkinleştir"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="SiteGround dinamik cache başlıklarını etkinleştirir. Sayfalar SiteGround'un ters proxy'si için önbelleğe alınabilir olarak işaretlenir."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="İçerik Değişikliğinde Otomatik Temizleme"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="İçerik kaydedildiğinde, silindiğinde veya durumu değiştirildiğinde ilgili cache girişlerini otomatik olarak temizler."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Temizleme Eşiği"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Temizlenmesi gereken URL sayısı bu değeri aşarsa, tek tek temizlemek yerine tam bir cache temizliği yapılır. Varsayılan: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="Hariç Tutulan URL'ler"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="Asla önbelleğe alınmaması gereken URL yollarını satır başına bir tane girin (site köküne göre). Düz bir yol, onunla başlayan her şeyi de kapsar: <code>/members</code>, <code>/members/profile</code> yolunu da kapsar. Herhangi bir metin için <code>*</code> kullanın (<code>/shop/*/checkout</code>), yalnızca o yolu eşleştirmek için satırı <code>$</code> ile bitirin (<code>/about$</code>), sorgu dizesini de eşleştirmek için <code>?</code> ekleyin (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Hariç Tutulan Menü Öğeleri"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Bu menü öğeleri altında gösterilen sayfalar asla önbelleğe alınmaz. URL yollarını tahmin etmekten daha kolaydır. Joomla, bir kategori blogundaki makaleler gibi bir menü öğesi üzerinden ulaşılan sayfalar için de o menü öğesini kullanır."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Önbelleğe Alınabilir Sorgu Parametreleri"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Sorgu dizesi içeren sayfalar önbelleğe alınmaz; sayfayı değiştirmeyen pazarlama izleme parametreleri (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...) bunun istisnasıdır. Bu sayfaların da önbelleğe alınabilmesi için diğer parametreleri buraya satır başına bir tane yazın; örneğin sayfalama için <code>start</code> veya <code>limitstart</code>. <code>format</code>, <code>tmpl</code> ve <code>task</code> asla önbelleğe alınmaz; URL'sinde listelenen bir parametre ile bir izleme parametresi bir arada bulunan sayfalar da alınmaz: SiteGround bunu parametresiz yolun altında saklardı."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="Hariç Tutulan Kullanıcı Aracıları"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="Satır başına bir metin parçası, örneğin <code>Feedly</code> veya <code>UptimeRobot</code>. Bir ziyaretçinin kullanıcı aracısı bunu içerdiğinde (büyük/küçük harf fark etmez), onun için oluşturulan sayfa cache'e kaydedilmez. Not: <em>Kullanıcı Aracısına Göre Ayır</em> açık değilse (Gelişmiş Ayarlar sekmesi), SiteGround onlara yine de başka biri için önbelleğe alınmış bir kopyayla yanıt verebilir."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Formlu sayfalar"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Bir Joomla formu, ziyaretçinin oturumuna ait bir güvenlik belirteci taşır; bu yüzden önbelleğe alınmış bir kopya doğrudan paylaşılamaz. <em>Formlu Sayfaları Önbelleğe Al</em> açıkken eklenti sayfayı belirteç olmadan önbelleğe alır ve ziyaretçinin tarayıcısı formu ilk kullandığında kendi belirtecini alır. Aşağıda işaretlenmemiş formların ve eklentinin tanımadığı formların sayfaları eskisi gibi önbelleğe alınmaz."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Formlu Sayfaları Önbelleğe Al"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Yalnızca aşağıda işaretlenen türde formlar içeren sayfaları önbelleğe alır; her ziyaretçinin belirteci betikle alınır. Ziyaretçinin tarayıcısında JavaScript gerekir (Convert Forms için zaten gereklidir). Bunu açtıktan sonra, kontrol etmek için her formu gizli bir pencerede bir kez gönderin. Form içeren hiçbir sayfanın önbelleğe alınmaması için kapatın."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Önbelleğe Alınabilecek Formlar"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Ziyaretçinin oturumundan belirteç dışında hiçbir şeye ihtiyaç duymadığı bilinen form türleri."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Joomla giriş modülü"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Diğer Formlar (işaretçiler)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="Yalnızca belirtece ihtiyaç duyan diğer formlar için: formun HTML'sinde geçen bir metin parçasını satır başına bir tane girin, örneğin <code>id=&quot;newsletter&quot;</code>. Bir formu buraya ancak ziyaretçinin oturumunda başka bir şey (captcha yanıtı, sepet, çok adımlı bir durum) tutmadığını kontrol ettikten sonra ekleyin."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Hariç Tutulan Bileşenler"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="SiteGround tarafından önbelleğe alınmaması gereken bileşenleri seçin."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Yönetici Panelinde Temizleme Düğmesini Göster"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Joomla yönetici alanının üst çubuğunda, her sayfada görünür bir «SiteGround Cache'i Temizle» düğmesi görüntüler. Yalnızca SiteGround'un sunucu cache'ini temizler. Joomla'nın kendi Sistem &rarr; Önbelleği Temizle işlevi ve JCH Optimize gibi optimize edicilerin önbellek temizleme düğmeleri SiteGround'un cache'ine dokunmaz; bu düğme de onlarınkine dokunmaz."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Düğme Modu"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Basit: tüm cache'i temizleyen tek bir düğme. Açılır menü: 'Tümünü Temizle' ve özel yol seçenekleri içeren bölünmüş düğme."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Basit - Tümünü Temizle"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Açılır Menü - Tümünü Temizle + Özel Yollar"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Özel Temizleme Yolları"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="Satır başına bir giriş, şu biçimde: Etiket|/yol. Bunlar açılır menüde seçenek olarak görünür. Örnek: Blog|/blog veya Haberler|/news"

