PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE="Önbelleğe Alınabilir Sayfalarda Oturum Çerezini Engelle"
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE_DESC="Önbelleğe alınabilir anonim GET isteklerinde Joomla'nın Set-Cookie yanıt başlığını kaldırır, böylece SiteGround'un uç sunucusu bunları gerçekten önbelleğe alabilir. Bu olmadan SiteGround, oturum çerezi yüzünden her misafir ziyaretini önbelleğe almadan geçer (X-Proxy-Cache-Info: SKIP_CACHE_SET_COOKIE). Hariç tutulan URL'ler ve bileşenler etkilenmez; formlar/CSRF için tam oturum almaya devam ederler. Üçüncü taraf bir eklentinin önbelleğe alınabilir anonim sayfalarda çerez ayarlaması gerekmedikçe AÇIK bırakın."
