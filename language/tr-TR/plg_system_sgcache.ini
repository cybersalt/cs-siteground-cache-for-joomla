PLG_SYSTEM_SGCACHE_ENABLE_LOGGING="Dosya Günlüğünü Etkinleştir"
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING_DESC="Cache işlemlerini Joomla günlük dizinindeki bir günlük dosyasına yazar. Sorun giderme için kullanışlıdır. En iyi performans için üretim ortamında devre dışı bırakın."
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING="Ayrıntılı Mod"
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING_DESC="Cache etkin yanıtlar dahil her ön yüz sayfa ziyaretini günlüğe kaydeder. Kapalıyken yalnızca cache atlama, temizleme, hatalar ve içerik değişiklikleri günlüğe kaydedilir. Sorun giderme için geçici olarak açın, ardından üretim için kapatın."
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG="Hata Ayıklama Panelini Etkinleştir"
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG_DESC="Her yönetici sayfasının altında, geçerli istek sırasında gerçekleşen cache işlemlerini gösteren bir hata ayıklama paneli görüntüler. Yalnızca yöneticilere görünür."
PLG_SYSTEM_SGCACHE_LOG_FILE="Günlük Dosya Adı"
PLG_SYSTEM_SGCACHE_LOG_FILE_DESC="Günlük dosyasının adı. Joomla'nın günlük klasöründe (Genel Yapılandırma &rarr; Sistem &rarr; Günlük Klasörü Yolu) bu adın sonuna .php eklenerek saklanır ve bir tarayıcının onu okumasını engelleyen bir satırla başlar. Varsayılan: sgcache.log"
