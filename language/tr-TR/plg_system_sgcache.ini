; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Cybersalt SiteGround Cache'e Hoş Geldiniz"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="SiteGround'un sunucu taraflı dinamik cache'iyle entegre olan bir Joomla 5 / 6 sistem eklentisi. Daha hızlı sayfa yüklemeleri, içerik değiştiğinde otomatik cache temizleme ve SiteGround'un uç sunucusunun sayfalarınızı gerçekten önbelleğe alması için doğru HTTP başlıkları sağlar."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Hızlı Başlangıç"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>SiteGround'un algılandığını doğrulayın.</strong> <em>Cache Ayarları</em> sekmesini açın ve üstteki durum paneline bakın. SiteGround Barındırma kutucuğunda 'Algılandı' yazmalıdır. Yazmıyorsa bu eklenti hiçbir şey yapmaz &mdash; yalnızca SiteGround sunucularında çalışır."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Varsayılanlara dokunmayın.</strong> Dinamik Cache, Otomatik Temizleme ve Oturum Çerezini Engelle varsayılan olarak AÇIK'tır. Bu, neredeyse her site için doğru kurulumdur."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Çalıştığını doğrulayın.</strong> Sitenizi gizli/özel bir pencerede açın ve yanıt başlıklarını kontrol edin. <code>X-Cache-Enabled: True</code> görmeli ve <code>Set-Cookie</code> <em>görmemelisiniz</em>. Bir dakika sonra tekrar kontrol edin &mdash; <code>X-Proxy-Cache: HIT</code>, SiteGround'un artık cache'ten sunduğu anlamına gelir."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Cache oranının yükselişini izleyin.</strong> SiteGround panelinizi ziyaret edin ve uç sunucu önbelleğe alınmış sayfalarla doldukça önümüzdeki 24&ndash;48 saat içinde cache oranının iyileşmesini izleyin."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="İpuçları"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Üzerinde Convert Forms, RSForm! Pro veya giriş modülü bulunan sayfalar, formun güvenlik belirteci çıkarılarak önbelleğe alınır; her ziyaretçinin tarayıcısı formu kullandığında kendi belirtecini alır. Başka herhangi bir Joomla formu içeren sayfalar algılanır ve önbelleğe alınmaz, böylece formları çalışmaya devam eder. Sayfalarınızın önbelleğe alınıp alınmadığını, alınmıyorsa nedenini görmek için Cache Ayarları sekmesindeki <em>Ana sayfamı test et</em> düğmesine tıklayın. <em>Hariç Tutulan URL'ler</em> veya <em>Hariç Tutulan Menü Öğeleri</em> ayarlarını yalnızca asla önbelleğe alınmaması gereken diğer sayfalar için kullanın; örneğin her ziyaretçiye farklı içerik gösteren sayfalar."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Büyük bir içerik değişikliği yayınladığınızda tek tıkla tüm cache'i boşaltmak için Joomla yönetici üst çubuğundaki <em>SiteGround Cache'i Temizle</em> düğmesini (varsayılan olarak etkin) kullanın. Yalnızca SiteGround'un cache'ini temizler; Joomla'nın kendi Önbelleği Temizle işlevi bunu yapmaz."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Sorun gideriyorsanız Günlük sekmesinden günlüğü açın. Satır içi panel her cache kararını gerçek zamanlı gösterir. Her şeyin hızlı kalması için canlı ortamda kapatın."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="Bu eklenti hakkında"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache, Cybersalt tarafından geliştirilen ve bakımı yapılan ücretsiz, açık kaynaklı bir Joomla 5 / 6 uzantısıdır. SiteGround'daki her Joomla sitesinin önbelleksiz çalışmasına yol açan SiteGround cache açığını kapatır &mdash; artık bu durum sona eriyor."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Kaynaklar"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="Daha fazla Cybersalt Joomla uzantısı"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="GitHub'daki kaynak kod"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Hata bildir / Özellik iste"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Destek &amp; hata bildirimleri"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="Bir hata bulursanız veya bir özellik isteğiniz varsa GitHub'da bir issue açın ya da doğrudan Cybersalt ile iletişime geçin. Her bildirime yanıt veriyoruz &mdash; bu eklentinin bakımı, yönettiğimiz canlı sitelerde aktif olarak yapılmaktadır."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Atıf"
