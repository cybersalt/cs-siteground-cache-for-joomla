; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Włącz dynamiczny cache"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Włącza nagłówki dynamicznego cache SiteGround. Strony zostaną oznaczone jako możliwe do buforowania dla reverse proxy SiteGround."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Automatyczne czyszczenie przy zmianie treści"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Automatycznie czyść powiązane wpisy cache gdy treść jest zapisywana, usuwana lub zmienia się jej stan."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Próg czyszczenia"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Jeśli liczba URL wymagających czyszczenia przekroczy tę wartość, zostanie wykonane pełne czyszczenie cache zamiast czyszczenia indywidualnego. Domyślnie: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="Wykluczone URL"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="Jedna ścieżka URL na linię (względem katalogu głównego strony), która nigdy nie powinna być buforowana. Zwykła ścieżka obejmuje też wszystko, co się od niej zaczyna: <code>/members</code> obejmuje <code>/members/profile</code>. Użyj <code>*</code> dla dowolnego tekstu (<code>/shop/*/checkout</code>), zakończ linię znakiem <code>$</code>, aby dopasować tylko tę ścieżkę (<code>/about$</code>), i dodaj <code>?</code>, aby dopasować także query string (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Wykluczone pozycje menu"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Strony wyświetlane pod tymi pozycjami menu nigdy nie są buforowane. To prostsze niż zgadywanie ścieżek URL. Joomla używa pozycji menu także dla stron otwieranych za jej pośrednictwem, np. artykułów bloga kategorii."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Parametry zapytania do buforowania"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Strony z query string nie są buforowane, z wyjątkiem marketingowych parametrów śledzących (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), które nie zmieniają strony. Wpisz tu inne parametry, po jednym na linię, aby te strony również mogły być buforowane, np. <code>start</code> lub <code>limitstart</code> dla stronicowania. <code>format</code>, <code>tmpl</code> i <code>task</code> nigdy nie są buforowane, podobnie jak strona, której URL łączy wymieniony parametr z parametrem śledzącym: SiteGround zapisałby ją pod samą ścieżką."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="Wykluczone user agenty"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="Jeden fragment tekstu na linię, np. <code>Feedly</code> lub <code>UptimeRobot</code>. Gdy user agent odwiedzającego go zawiera (wielkość liter nie ma znaczenia), strona wygenerowana dla niego nie jest zapisywana w cache. Uwaga: SiteGround nadal może mu zwrócić kopię zbuforowaną dla kogoś innego, chyba że włączone jest <em>Różnicowanie wg User Agent</em> (karta Zaawansowane)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Strony z formularzami"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Formularz Joomla zawiera token bezpieczeństwa należący do sesji odwiedzającego, więc kopii z cache nie można po prostu udostępniać. Przy włączonej opcji <em>Buforuj strony z formularzami</em> plugin buforuje stronę bez tokenu, a przeglądarka odwiedzającego pobiera własny token przy pierwszym użyciu formularza. Formularze niezaznaczone poniżej oraz formularze, których plugin nie rozpoznaje, pozostawiają swoją stronę niebuforowaną, jak dotychczas."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Buforuj strony z formularzami"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Buforuj strony, na których są wyłącznie formularze typów zaznaczonych poniżej; token każdego odwiedzającego jest pobierany skryptem. Wymaga JavaScriptu w przeglądarce odwiedzającego (Convert Forms i tak go potrzebuje). Po włączeniu wyślij każdy formularz raz w oknie prywatnym, aby go sprawdzić. Wyłącz, aby żadna strona z formularzem nie była buforowana."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Formularze, które mogą być buforowane"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Typy formularzy, o których wiadomo, że poza tokenem nie potrzebują niczego z sesji odwiedzającego."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Moduł logowania Joomla"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Inne formularze (znaczniki)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="Dla innych formularzy, które potrzebują tylko tokenu: jeden fragment tekstu na linię, występujący w HTML formularza, np. <code>id=&quot;newsletter&quot;</code>. Dodaj tu formularz dopiero po sprawdzeniu, że nie przechowuje niczego innego w sesji odwiedzającego (odpowiedzi captcha, koszyka, stanu wieloetapowego)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Wykluczone komponenty"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Wybierz komponenty, których strony nigdy nie powinny być buforowane przez SiteGround."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Pokaż przycisk czyszczenia w panelu admina"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Wyświetla przycisk 'Wyczyść cache SiteGround' na górnym pasku panelu administracyjnego Joomla, widoczny na każdej stronie. Czyści on tylko cache serwera SiteGround. Własne System &rarr; Wyczyść cache w Joomla ani przyciski czyszczenia cache optymalizatorów takich jak JCH Optimize nie dotykają cache SiteGround, a ten przycisk nie dotyka ich cache."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Tryb przycisku"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Prosty: jeden przycisk czyszczący cały cache. Dropdown: przycisk podzielony z opcją 'Wyczyść wszystko' oraz niestandardowymi ścieżkami."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Prosty - Wyczyść wszystko"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Dropdown - Wyczyść wszystko + Niestandardowe ścieżki"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Niestandardowe ścieżki czyszczenia"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="Jeden wpis na linię w formacie: Etykieta|/ścieżka. Pojawiają się jako opcje w dropdown. Przykład: Blog|/blog lub Aktualności|/aktualnosci"

