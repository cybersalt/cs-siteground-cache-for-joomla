PLG_SYSTEM_SGCACHE_VARY_USER_AGENT="Różnicowanie wg User Agent"
PLG_SYSTEM_SGCACHE_VARY_USER_AGENT_DESC="Dodaje nagłówek Vary: User-Agent aby serwować różne wersje cache dla przeglądarek mobilnych i desktopowych."
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN="Cache dla zalogowanych użytkowników"
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN_DESC="Zezwól na buforowanie dla zalogowanych użytkowników. UWAGA: Może wyświetlać nieprawidłową treść użytkownikom. Włącz tylko jeśli Twoja strona wyświetla tę samą treść wszystkim użytkownikom."
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE="Blokuj ciasteczko sesji na stronach buforowalnych"
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE_DESC="Usuwa nagłówek odpowiedzi Set-Cookie Joomla przy buforowalnych anonimowych żądaniach GET, aby edge SiteGround mógł je faktycznie buforować. Bez tego SiteGround pomija buforowanie każdej wizyty gościa z powodu ciasteczka sesji (X-Proxy-Cache-Info: SKIP_CACHE_SET_COOKIE). Wykluczone URL i komponenty pozostają nietknięte i nadal otrzymują pełne sesje dla formularzy/CSRF. Pozostaw WŁĄCZONE, chyba że plugin firm trzecich musi ustawiać ciasteczka na buforowalnych anonimowych stronach."
PLG_SYSTEM_SGCACHE_PURGE_BUTTON="Ręczne czyszczenie cache"
PLG_SYSTEM_SGCACHE_PURGE_BUTTON_DESC="Kliknij, aby ręcznie wyczyścić cały cache SiteGround."

