; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Witamy w Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="Plugin systemowy dla Joomla 5 / 6, który integruje się z serwerowym dynamicznym cache SiteGround. Szybsze ładowanie stron, automatyczne czyszczenie cache po zmianach treści i właściwe nagłówki HTTP, dzięki którym edge SiteGround faktycznie buforuje Twoje strony."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Szybki start"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Sprawdź, czy SiteGround został wykryty.</strong> Otwórz kartę <em>Cache</em> i spójrz na panel stanu u góry. Kafelek Hosting SiteGround powinien pokazywać 'Wykryto'. Jeśli nie, ten plugin nic nie zrobi &mdash; działa tylko na serwerach SiteGround."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Zostaw ustawienia domyślne.</strong> Dynamiczny cache, automatyczne czyszczenie i blokowanie ciasteczka sesji są domyślnie WŁĄCZONE. To właściwa konfiguracja dla niemal każdej strony."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Sprawdź, czy działa.</strong> Otwórz stronę w oknie prywatnym/incognito i sprawdź nagłówki odpowiedzi. Powinieneś zobaczyć <code>X-Cache-Enabled: True</code> i <em>brak</em> <code>Set-Cookie</code>. Sprawdź ponownie po minucie &mdash; <code>X-Proxy-Cache: HIT</code> oznacza, że SiteGround serwuje już z cache."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Obserwuj wzrost wskaźnika cache.</strong> Wejdź do panelu SiteGround i obserwuj, jak wskaźnik cache rośnie w ciągu najbliższych 24&ndash;48 godzin, w miarę jak edge zapełnia się zbuforowanymi stronami."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Wskazówki"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Strony z Convert Forms, RSForm! Pro lub modułem logowania są buforowane bez tokenu bezpieczeństwa formularza; przeglądarka każdego odwiedzającego pobiera własny token, gdy używa formularza. Strony z każdym innym formularzem Joomla są wykrywane i pozostawiane bez buforowania, więc ich formularze nadal działają. Kliknij <em>Testuj moją stronę główną</em> na karcie Cache, aby sprawdzić, czy Twoje strony są buforowane, a jeśli nie, to dlaczego. Używaj <em>Wykluczone URL</em> lub <em>Wykluczone pozycje menu</em> tylko dla innych stron, które nigdy nie mogą być buforowane, np. stron pokazujących każdemu odwiedzającemu inną treść."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Użyj przycisku <em>Wyczyść cache SiteGround</em> na górnym pasku panelu administracyjnego Joomla (domyślnie włączony), aby jednym kliknięciem wyczyścić cały cache, gdy wprowadzasz dużą zmianę treści. Czyści on tylko cache SiteGround; własne Wyczyść cache w Joomla tego nie robi."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Włącz kartę Logowanie, jeśli rozwiązujesz problemy. Wbudowany panel pokazuje każdą decyzję cache w czasie rzeczywistym. Wyłącz ją na produkcji, aby wszystko działało sprawnie."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="O tym pluginie"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache to darmowe rozszerzenie open source dla Joomla 5 / 6, tworzone i utrzymywane przez Cybersalt. Wypełnia lukę w buforowaniu SiteGround, przez którą każda strona Joomla na SiteGround działała bez cache &mdash; aż do teraz."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Zasoby"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="Więcej rozszerzeń Joomla od Cybersalt"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="Kod źródłowy na GitHub"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Zgłoś błąd / Zaproponuj funkcję"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Wsparcie &amp; zgłoszenia błędów"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="Jeśli znajdziesz błąd lub masz propozycję funkcji, otwórz zgłoszenie na GitHub lub skontaktuj się bezpośrednio z Cybersalt. Odpowiadamy na każde zgłoszenie &mdash; ten plugin jest aktywnie utrzymywany na stronach produkcyjnych, którymi zarządzamy."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Uznanie autorstwa"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="Protokół komunikacji z cache SiteGround (API gniazda UNIX do czyszczenia cache) został poznany dzięki analizie pluginu Speed Optimizer od SiteGround dla WordPress (GPLv3). Żaden kod WordPress nie został skopiowany; jest to niezależna implementacja dla Joomla napisana od podstaw z użyciem natywnego API pluginów Joomla 5. Nie jest powiązane z SiteGround ani przez SiteGround zatwierdzone."
