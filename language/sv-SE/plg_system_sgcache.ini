; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Välkommen till Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="Ett systemplugin för Joomla 5 / 6 som integreras med SiteGrounds dynamiska cache på serversidan. Få snabbare sidladdning, automatisk cache-rensning när innehåll ändras och rätt HTTP-headers så att SiteGrounds edge faktiskt cachelagrar dina sidor."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Snabbstart"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Kontrollera att SiteGround upptäcks.</strong> Öppna fliken <em>Cache</em> och titta på statuspanelen högst upp. Rutan SiteGround-hosting ska visa 'Upptäckt'. Om inte gör det här pluginet ingenting &mdash; det fungerar bara på SiteGround-servrar."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Låt standardinställningarna vara.</strong> Dynamisk Cache, Automatisk Rensning och Undertryck Sessionscookie är alla PÅ som standard. Det är rätt inställning för nästan alla webbplatser."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Kontrollera att det fungerar.</strong> Öppna din webbplats i ett privat/inkognitofönster och kontrollera svarsheaders. Du bör se <code>X-Cache-Enabled: True</code> och <em>ingen</em> <code>Set-Cookie</code>. Kontrollera igen efter en minut &mdash; <code>X-Proxy-Cache: HIT</code> betyder att SiteGround nu svarar från cachen."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Se cachegraden stiga.</strong> Gå till din SiteGround-instrumentpanel och se hur cachegraden förbättras under de kommande 24&ndash;48 timmarna när edge fylls med cachelagrade sidor."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Tips"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Sidor med Convert Forms, RSForm! Pro eller inloggningsmodulen cachelagras utan formulärets säkerhetstoken; varje besökares webbläsare hämtar sin egen när formuläret används. Sidor med något annat Joomla-formulär upptäcks och lämnas ocachade, så att deras formulär fortsätter att fungera. Klicka på <em>Testa min startsida</em> på fliken Cache för att se om dina sidor cachelagras, och varför inte om de inte gör det. Använd <em>Exkluderade URL</em> eller <em>Exkluderade Menyalternativ</em> bara för andra sidor som aldrig får cachelagras, till exempel sidor som visar olika innehåll för varje besökare."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Använd knappen <em>Rensa SiteGround-cache</em> i toppfältet i Joomlas administration (aktiverad som standard) för att rensa hela cachen med ett klick när du gör en stor innehållsändring. Den rensar bara SiteGrounds cache; Joomlas egen Rensa cache gör inte det."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Slå på fliken Loggning om du felsöker. Den inbyggda panelen visar varje cachebeslut i realtid. Stäng av den i produktion för att hålla allt snabbt."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="Om detta plugin"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache är ett gratis tillägg med öppen källkod för Joomla 5 / 6, byggt och underhållet av Cybersalt. Det täpper till luckan i SiteGrounds cachelagring som har gjort att varje Joomla-webbplats på SiteGround körts utan cache &mdash; fram till nu."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Resurser"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="Fler Joomla-tillägg från Cybersalt"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="Källkod på GitHub"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Rapportera ett fel / Önska en funktion"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Support &amp; felrapporter"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="Om du hittar ett fel eller har ett funktionsönskemål, öppna ett ärende på GitHub eller kontakta Cybersalt direkt. Vi svarar på varje rapport &mdash; detta plugin underhålls aktivt på produktionswebbplatser som vi förvaltar."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Erkännande"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="SiteGrounds protokoll för cache-kommunikation (UNIX-socket-API för cache-rensning) har lärts genom att studera SiteGrounds Speed Optimizer-plugin för WordPress (GPLv3). Ingen WordPress-kod kopierades; detta är en oberoende Joomla-implementation skriven från grunden med Joomla 5:s inbyggda plugin-API. Ej ansluten till eller godkänd av SiteGround."
