PLG_SYSTEM_SGCACHE_VARY_USER_AGENT="Variera efter User Agent"
PLG_SYSTEM_SGCACHE_VARY_USER_AGENT_DESC="Lägg till Vary: User-Agent-header för att servera olika cachade versioner för mobila och stationära webbläsare."
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN="Cache för Inloggade Användare"
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN_DESC="Tillåt cachelagring för inloggade användare. VARNING: Kan visa felaktigt innehåll för användare. Aktivera bara om din webbplats visar samma innehåll för alla användare."
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE="Undertryck Sessionscookie på Cachebara Sidor"
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE_DESC="Ta bort Joomlas Set-Cookie-svarsheader på cachebara anonyma GET-förfrågningar så att SiteGrounds edge faktiskt kan cachelagra dem. Utan detta hoppar SiteGround över cachelagring av varje gästbesök på grund av sessionscookien (X-Proxy-Cache-Info: SKIP_CACHE_SET_COOKIE). Exkluderade URL och komponenter påverkas inte och får fortfarande fullständiga sessioner för formulär/CSRF. Låt vara PÅ om inte ett tredjepartsplugin behöver sätta cookies på cachebara anonyma sidor."
