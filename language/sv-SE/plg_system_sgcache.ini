; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Aktivera Dynamisk Cache"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Aktivera SiteGrounds dynamiska cache-headers. Sidor markeras som cachebara för SiteGrounds reverse proxy."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Automatisk Rensning vid Innehållsändring"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Rensa automatiskt relaterade cache-poster när innehåll sparas, tas bort eller ändrar status."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Rensningströskel"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Om fler URL behöver rensas än detta antal, utförs en fullständig cache-rensning istället för individuell rensning. Standard: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="Exkluderade URL"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="En URL-sökväg per rad (relativ till webbplatsens rot) som aldrig ska cachelagras. En vanlig sökväg omfattar också allt som börjar med den: <code>/members</code> omfattar <code>/members/profile</code>. Använd <code>*</code> för valfri text (<code>/shop/*/checkout</code>), avsluta en rad med <code>$</code> för att bara matcha just den sökvägen (<code>/about$</code>) och ta med <code>?</code> för att även matcha frågesträngen (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Exkluderade Menyalternativ"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Sidor som visas under dessa menyalternativ cachelagras aldrig. Enklare än att gissa URL-sökvägar. Joomla använder också ett menyalternativ för sidor som nås via det, till exempel artiklarna i en kategoriblogg."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Cachebara Frågeparametrar"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Sidor med en frågesträng cachelagras inte, förutom vid spårningsparametrar för marknadsföring (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), som inte ändrar sidan. Ange andra parametrar här, en per rad, för att låta även de sidorna cachelagras, till exempel <code>start</code> eller <code>limitstart</code> för sidnumrering. <code>format</code>, <code>tmpl</code> och <code>task</code> cachelagras aldrig, och inte heller en sida vars URL blandar en angiven parameter med en spårningsparameter: SiteGround skulle lagra den under den rena sökvägen."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="Exkluderade User Agents"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="En textsträng per rad, till exempel <code>Feedly</code> eller <code>UptimeRobot</code>. När en besökares user agent innehåller den (skiftläget spelar ingen roll) lagras inte sidan som renderats för besökaren i cachen. Obs: SiteGround kan ändå svara med en kopia som cachelagrats för någon annan, om inte <em>Variera efter User Agent</em> är på (fliken Avancerat)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Sidor med formulär"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Ett Joomla-formulär innehåller en säkerhetstoken som hör till besökarens session, så en cachelagrad kopia kan inte bara delas. Med <em>Cachelagra Sidor med Formulär</em> på cachelagrar pluginet sidan utan token, och besökarens webbläsare hämtar sin egen token första gången formuläret används. Formulär som inte är markerade nedan, och formulär som pluginet inte känner igen, behåller sin sida ocachad som tidigare."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Cachelagra Sidor med Formulär"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Cachelagra sidor vars enda formulär är av de typer som markerats nedan, där varje besökares token hämtas med skript. Kräver JavaScript i besökarens webbläsare (Convert Forms behöver det ändå). Skicka varje formulär en gång i ett privat fönster för att kontrollera det när du har slagit på detta. Stäng av för att hålla alla sidor med formulär ocachade."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Formulär som Får Cachelagras"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Formulärtyper som är kända för att inte behöva något från besökarens session förutom token."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Joomlas inloggningsmodul"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Andra Formulär (markörer)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="För andra formulär som bara behöver token: en textsträng per rad som finns i formulärets HTML, till exempel <code>id=&quot;newsletter&quot;</code>. Lägg bara till ett formulär här efter att ha kontrollerat att det inte sparar något annat i besökarens session (ett captcha-svar, en varukorg, ett tillstånd i flera steg)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Exkluderade Komponenter"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Välj komponenter vars sidor aldrig ska cachelagras av SiteGround."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Visa Rensningsknapp i Administrationen"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Visa en 'Rensa SiteGround-cache'-knapp i toppfältet i Joomlas administrationsområde, synlig på varje sida. Den rensar bara SiteGrounds servercache. Joomlas egen System &rarr; Rensa cache och rensningsknapparna i optimerare som JCH Optimize påverkar inte SiteGrounds cache, och den här knappen påverkar inte deras."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Knappläge"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Enkel: en knapp som rensar all cache. Rullgardin: en delad knapp med 'Rensa Allt' plus anpassade sökvägsalternativ."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Enkel - Rensa Allt"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Rullgardin - Rensa Allt + Anpassade Sökvägar"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Anpassade Rensningssökvägar"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="En post per rad i formatet: Etikett|/sökväg. Dessa visas som alternativ i rullgardinsmenyn. Exempel: Blog|/blog eller News Section|/news"

