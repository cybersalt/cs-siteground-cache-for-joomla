PLG_SYSTEM_SGCACHE_VARY_USER_AGENT="Variar por User Agent"
PLG_SYSTEM_SGCACHE_VARY_USER_AGENT_DESC="Añade el encabezado Vary: User-Agent para servir diferentes versiones cacheadas para navegadores móviles y de escritorio."
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN="Cache para usuarios conectados"
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN_DESC="Permitir cache para usuarios conectados. ADVERTENCIA: Puede mostrar contenido incorrecto a los usuarios. Solo active si su sitio muestra el mismo contenido a todos los usuarios."
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE="Suprimir la cookie de sesión en páginas cacheables"
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE_DESC="Elimina el encabezado de respuesta Set-Cookie de Joomla en las solicitudes GET anónimas cacheables para que el edge de SiteGround pueda realmente cachearlas. Sin esto, SiteGround omite el cacheo de cada visita de invitado por la cookie de sesión (X-Proxy-Cache-Info: SKIP_CACHE_SET_COOKIE). Las URL y componentes excluidos no se ven afectados y siguen recibiendo sesiones completas para formularios/CSRF. Déjelo ACTIVADO salvo que un plugin de terceros necesite establecer cookies en páginas anónimas cacheables."
PLG_SYSTEM_SGCACHE_PURGE_BUTTON="Purga manual de cache"
PLG_SYSTEM_SGCACHE_PURGE_BUTTON_DESC="Haga clic para purgar manualmente toda la cache de SiteGround."

