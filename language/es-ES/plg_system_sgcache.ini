; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Activar cache dinámica"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Activa los encabezados de cache dinámica de SiteGround. Las páginas serán marcadas como cacheables para el proxy inverso de SiteGround."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Purga automática al cambiar contenido"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Purgar automáticamente las entradas de cache relacionadas cuando el contenido se guarda, elimina o cambia de estado."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Umbral de purga"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Si se necesita purgar más de esta cantidad de URL's, se realizará una limpieza completa de cache en lugar de purgar individualmente. Predeterminado: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="URL's excluidas"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="Una ruta de URL por línea (relativa a la raíz del sitio) que nunca debe cachearse. Una ruta simple también cubre todo lo que empieza por ella: <code>/members</code> cubre <code>/members/profile</code>. Use <code>*</code> para cualquier texto (<code>/shop/*/checkout</code>), termine una línea con <code>$</code> para que coincida solo esa ruta (<code>/about$</code>) e incluya <code>?</code> para que también se compare la cadena de consulta (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Elementos de menú excluidos"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Las páginas mostradas bajo estos elementos de menú nunca se cachean. Es más fácil que adivinar rutas de URL. Joomla también usa un elemento de menú para las páginas a las que se llega a través de él, como los artículos de un blog de categoría."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Parámetros de consulta cacheables"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Las páginas con una cadena de consulta no se cachean, excepto con parámetros de seguimiento de marketing (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), que no cambian la página. Indique aquí otros parámetros, uno por línea, para que esas páginas también puedan cachearse, por ejemplo <code>start</code> o <code>limitstart</code> para la paginación. <code>format</code>, <code>tmpl</code> y <code>task</code> nunca se cachean, ni tampoco una página cuya URL mezcle un parámetro de la lista con uno de seguimiento: SiteGround la guardaría bajo la ruta sin parámetros."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="User Agents excluidos"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="Un texto por línea, por ejemplo <code>Feedly</code> o <code>UptimeRobot</code>. Cuando el user agent de un visitante lo contiene (sin distinguir mayúsculas y minúsculas), la página generada para él no se guarda en la cache. Nota: SiteGround aún puede servirle una copia cacheada para otra persona, a menos que <em>Variar por User Agent</em> esté activado (pestaña Configuración avanzada)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Páginas con formularios"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Un formulario de Joomla lleva un token de seguridad que pertenece a la sesión del visitante, por lo que una copia cacheada no puede compartirse sin más. Con <em>Cachear páginas con formularios</em> activado, el plugin cachea la página sin el token y el navegador del visitante obtiene su propio token la primera vez que usa el formulario. Los formularios no marcados abajo, y los que el plugin no reconoce, mantienen su página sin cachear como antes."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Cachear páginas con formularios"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Cachea las páginas cuyos únicos formularios son de los tipos marcados abajo, obteniendo el token de cada visitante mediante script. Requiere JavaScript en el navegador del visitante (Convert Forms lo necesita de todos modos). Tras activarlo, envíe cada formulario una vez en una ventana privada para comprobarlo. Desactívelo para mantener sin cachear todas las páginas con formulario."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Formularios que se pueden cachear"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Tipos de formulario que se sabe que no necesitan nada de la sesión del visitante salvo el token."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Módulo de inicio de sesión de Joomla"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Otros formularios (marcadores)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="Para otros formularios que solo necesitan el token: un texto por línea que aparezca dentro del HTML del formulario, como <code>id=&quot;newsletter&quot;</code>. Añada un formulario aquí solo después de comprobar que no guarda nada más en la sesión del visitante (una respuesta de captcha, un carrito, un estado de varios pasos)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Componentes excluidos"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Seleccione los componentes cuyas páginas nunca deben ser cacheadas por SiteGround."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Mostrar botón de purga en administración"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Muestra un botón 'Purgar la cache de SiteGround' en la barra superior del área de administración de Joomla, visible en cada página. Solo borra la cache del servidor de SiteGround. La opción Sistema &rarr; Borrar caché de Joomla y los botones de limpieza de cache de optimizadores como JCH Optimize no tocan la cache de SiteGround, y este botón no toca la suya."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Modo del botón"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Simple: un botón que purga toda la cache. Dropdown: un botón dividido con 'Purgar todo' más opciones de rutas personalizadas."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Simple - Purgar todo"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Dropdown - Purgar todo + Rutas personalizadas"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Rutas de purga personalizadas"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="Una entrada por línea en el formato: Etiqueta|/ruta. Estas aparecen como opciones en el dropdown. Ejemplo: Blog|/blog o Sección de noticias|/noticias"

; Toolbar button labels
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE="Purgar la cache de SiteGround"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_TITLE="Borra la cache del servidor de SiteGround (no la cache propia de Joomla)"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_ALL="Purgar toda la cache"
