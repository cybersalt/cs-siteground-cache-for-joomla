; Home page watchdog (System > Scheduled Tasks)
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE_LABEL="Vigilancia de la página de inicio"
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE="Una tarea programada puede obtener su página de inicio cada pocos minutos y, si alguna vez devuelve algo que no es una página web, purgar la cache de SiteGround y enviarle un correo. El instalador la añade sin publicar: vaya a <a href='index.php?option=com_scheduler&amp;view=tasks'>Sistema &rarr; Tareas programadas</a>, abra <em>SiteGround Cache: vigilancia de la página de inicio</em> y publíquela."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_TITLE="SiteGround Cache: vigilancia de la página de inicio"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_DESC="Obtiene la página de inicio (y las rutas adicionales) como visitante. Si alguna devuelve algo que no es una página HTML, purga la cache de SiteGround, vuelve a comprobar y envía un informe por correo."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_SITE_URL_LABEL="Dirección del sitio"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_SITE_URL_DESC="La dirección de la página de inicio del sitio, por ejemplo https://www.example.com/. Se rellena automáticamente; es necesaria porque una tarea ejecutada desde la línea de comandos (cli/joomla.php) no puede averiguar por sí misma la dirección del sitio."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_NOTIFY_EMAIL_LABEL="Enviar informes a"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_NOTIFY_EMAIL_DESC="Déjelo vacío para usar el correo de remitente del sitio (Configuración global &rarr; Servidor &rarr; Correo)."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_EXTRA_PATHS_LABEL="Comprobar también estas rutas"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_EXTRA_PATHS_DESC="Una ruta por línea, empezando por /, por ejemplo /blog. La página de inicio siempre se comprueba."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_SUBJECT="%s: la cache de SiteGround sirvió una página rota"
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_INTRO="La vigilancia de SiteGround Cache en %1$s (%2$s) obtuvo estas páginas como visitante y no devolvieron páginas web normales:"
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_PURGED="Se purgó la cache de SiteGround."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_PURGE_FAILED="No se pudo purgar la cache de SiteGround. Use el botón Purgar la cache de SiteGround en la administración de Joomla."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_FIXED="Tras la purga, todas las páginas respondieron con normalidad."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_STILL="Tras la purga, estas seguían respondiendo mal: %s. Revise el sitio."
