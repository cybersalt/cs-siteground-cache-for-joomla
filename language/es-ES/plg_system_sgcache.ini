; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Bienvenido a Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="Un plugin de sistema para Joomla 5 / 6 que se integra con la cache dinámica del lado del servidor de SiteGround. Consiga cargas de página más rápidas, purga automática de la cache al cambiar el contenido y los encabezados HTTP correctos para que el edge de SiteGround realmente cachee sus páginas."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Inicio rápido"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Confirme que SiteGround está detectado.</strong> Abra la pestaña <em>Configuración de cache</em> y mire el panel de estado de la parte superior. La casilla Alojamiento SiteGround debe indicar 'Detectado'. Si no, este plugin no hará nada &mdash; solo funciona en servidores de SiteGround."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Deje los valores predeterminados.</strong> Cache dinámica, purga automática y Suprimir la cookie de sesión están todos ACTIVADOS por defecto. Es la configuración correcta para casi todos los sitios."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Compruebe que funciona.</strong> Abra su sitio en una ventana privada/de incógnito y revise los encabezados de respuesta. Debería ver <code>X-Cache-Enabled: True</code> y <em>ningún</em> <code>Set-Cookie</code>. Vuelva a comprobarlo después de un minuto &mdash; <code>X-Proxy-Cache: HIT</code> significa que SiteGround ya sirve desde la cache."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Vea cómo sube la tasa de cache.</strong> Visite su panel de SiteGround y observe cómo mejora la tasa de cache durante las próximas 24&ndash;48 horas a medida que el edge se llena de páginas cacheadas."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Consejos"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Las páginas con Convert Forms, RSForm! Pro o el módulo de inicio de sesión se cachean sin el token de seguridad del formulario; el navegador de cada visitante obtiene el suyo cuando usa el formulario. Las páginas con cualquier otro formulario de Joomla se detectan y se dejan sin cachear, para que sus formularios sigan funcionando. Haga clic en <em>Probar mi página de inicio</em> en la pestaña Configuración de cache para ver si sus páginas se cachean, y por qué no si no es así. Use <em>URL's excluidas</em> o <em>Elementos de menú excluidos</em> solo para otras páginas que nunca deban cachearse, como las que muestran contenido distinto a cada visitante."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Use el botón <em>Purgar la cache de SiteGround</em> de la barra superior de la administración de Joomla (activado por defecto) para vaciar toda la cache con un clic cada vez que publique un cambio de contenido importante. Solo borra la cache de SiteGround; la opción Borrar caché propia de Joomla no lo hace."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Active el registro (pestaña Registro) si está resolviendo problemas. El panel integrado muestra cada decisión de cache en tiempo real. Desactívelo en producción para que todo siga siendo ágil."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="Acerca de este plugin"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache es una extensión gratuita y de código abierto para Joomla 5 / 6, creada y mantenida por Cybersalt. Cierra la brecha de cacheo de SiteGround que ha dejado a todos los sitios Joomla en SiteGround funcionando sin cache &mdash; hasta ahora."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Recursos"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="Más extensiones de Joomla de Cybersalt"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="Código fuente en GitHub"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Informar de un error / Solicitar una función"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Soporte &amp; informes de errores"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="Si encuentra un error o tiene una solicitud de función, abra una incidencia en GitHub o contacte directamente con Cybersalt. Respondemos a todos los informes &mdash; este plugin se mantiene activamente en sitios en producción que gestionamos."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Atribución"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="El protocolo de comunicación de la cache de SiteGround (API de socket UNIX para purgar la cache) se aprendió estudiando el plugin Speed Optimizer de SiteGround para WordPress (GPLv3). No se copió ningún código de WordPress; esta es una implementación independiente para Joomla escrita desde cero con la API de plugins nativa de Joomla 5. No afiliado ni respaldado por SiteGround."
