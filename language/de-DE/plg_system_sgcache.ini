; Getting Started tab
PLG_SYSTEM_SGCACHE_GS_WELCOME="Willkommen bei Cybersalt SiteGround Cache"
PLG_SYSTEM_SGCACHE_GS_TAGLINE="Ein System-Plugin für Joomla 5 / 6, das sich in den serverseitigen dynamischen Cache von SiteGround integriert. Schnellere Seitenladezeiten, automatisches Leeren des Caches bei Inhaltsänderungen und die richtigen HTTP-Header, damit der Edge-Cache von SiteGround Ihre Seiten tatsächlich cachet."
PLG_SYSTEM_SGCACHE_GS_STEPS_HEADING="Schnellstart"
PLG_SYSTEM_SGCACHE_GS_STEP_1="<strong>Prüfen Sie, ob SiteGround erkannt wird.</strong> Öffnen Sie die Registerkarte <em>Cache-Einstellungen</em> und sehen Sie sich das Statusfeld oben an. Die Kachel SiteGround-Hosting sollte 'Erkannt' anzeigen. Falls nicht, bewirkt dieses Plugin nichts &mdash; es funktioniert nur auf SiteGround-Servern."
PLG_SYSTEM_SGCACHE_GS_STEP_2="<strong>Lassen Sie die Standardwerte unverändert.</strong> Dynamischer Cache, automatisches Leeren und Sitzungscookie unterdrücken sind standardmäßig alle AN. Das ist für fast jede Website die richtige Einstellung."
PLG_SYSTEM_SGCACHE_GS_STEP_3="<strong>Prüfen Sie, ob es funktioniert.</strong> Öffnen Sie Ihre Website in einem privaten/Inkognito-Fenster und prüfen Sie die Antwortheader. Sie sollten <code>X-Cache-Enabled: True</code> und <em>kein</em> <code>Set-Cookie</code> sehen. Prüfen Sie nach einer Minute erneut &mdash; <code>X-Proxy-Cache: HIT</code> bedeutet, dass SiteGround nun aus dem Cache ausliefert."
PLG_SYSTEM_SGCACHE_GS_STEP_4="<strong>Beobachten Sie, wie die Cache-Quote steigt.</strong> Öffnen Sie Ihr SiteGround-Dashboard und beobachten Sie, wie sich die Cache-Quote in den nächsten 24&ndash;48 Stunden verbessert, während sich der Edge-Cache mit gecacheten Seiten füllt."
PLG_SYSTEM_SGCACHE_GS_TIPS_HEADING="Tipps"
PLG_SYSTEM_SGCACHE_GS_TIP_1="Seiten mit Convert Forms, RSForm! Pro oder dem Anmeldemodul werden gecachet, wobei das Sicherheitstoken des Formulars entfernt wird; der Browser jedes Besuchers holt sich sein eigenes, wenn er das Formular benutzt. Seiten mit einem anderen Joomla-Formular werden erkannt und nicht gecachet, damit ihre Formulare weiter funktionieren. Klicken Sie auf der Registerkarte Cache-Einstellungen auf <em>Meine Startseite testen</em>, um zu sehen, ob Ihre Seiten gecachet werden und warum nicht, falls nicht. Verwenden Sie <em>Ausgeschlossene URL's</em> oder <em>Ausgeschlossene Menüeinträge</em> nur für andere Seiten, die nie gecachet werden dürfen, etwa Seiten, die jedem Besucher andere Inhalte zeigen."
PLG_SYSTEM_SGCACHE_GS_TIP_2="Verwenden Sie die Schaltfläche <em>SiteGround-Cache leeren</em> in der oberen Leiste des Joomla-Adminbereichs (standardmäßig aktiviert), um den gesamten Cache mit einem Klick zu leeren, wenn Sie eine große Inhaltsänderung veröffentlichen. Sie leert nur den Cache von SiteGround; Joomlas eigenes Cache leeren tut das nicht."
PLG_SYSTEM_SGCACHE_GS_TIP_3="Aktivieren Sie die Protokollierung (Registerkarte Protokollierung), wenn Sie Fehler suchen. Das eingebettete Dashboard zeigt jede Cache-Entscheidung in Echtzeit. Deaktivieren Sie sie im Produktivbetrieb, damit alles schnell bleibt."

; About tab
PLG_SYSTEM_SGCACHE_ABOUT_HEADING="Über dieses Plugin"
PLG_SYSTEM_SGCACHE_ABOUT_BODY="Cybersalt SiteGround Cache ist eine kostenlose Open-Source-Erweiterung für Joomla 5 / 6, entwickelt und gepflegt von Cybersalt. Sie schließt die Caching-Lücke, durch die jede Joomla-Website bei SiteGround ungecachet lief &mdash; bis jetzt."
PLG_SYSTEM_SGCACHE_ABOUT_LINKS_HEADING="Ressourcen"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_EXTENSIONS="Weitere Joomla-Erweiterungen von Cybersalt"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_GITHUB="Quellcode auf GitHub"
PLG_SYSTEM_SGCACHE_ABOUT_LINK_BUG_REPORT="Fehler melden / Funktion vorschlagen"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_HEADING="Support &amp; Fehlerberichte"
PLG_SYSTEM_SGCACHE_ABOUT_SUPPORT_BODY="Wenn Sie einen Fehler finden oder einen Funktionswunsch haben, eröffnen Sie ein Issue auf GitHub oder kontaktieren Sie Cybersalt direkt. Wir antworten auf jeden Bericht &mdash; dieses Plugin wird auf von uns betreuten Produktivseiten aktiv gepflegt."
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_HEADING="Quellenangabe"
PLG_SYSTEM_SGCACHE_ABOUT_ATTRIBUTION_BODY="Das Kommunikationsprotokoll des SiteGround-Caches (UNIX-Socket-API zum Leeren des Caches) wurde durch das Studium des Speed Optimizer Plugins von SiteGround für WordPress (GPLv3) erlernt. Es wurde kein WordPress-Code kopiert; dies ist eine unabhängige Joomla-Implementierung, von Grund auf neu geschrieben mit der nativen Plugin-API von Joomla 5. Nicht mit SiteGround verbunden oder von SiteGround unterstützt."
PLG_SYSTEM_SGCACHE_ABOUT_LICENSE="Copyright (C) 2026 Cybersalt. Veröffentlicht unter der GNU General Public License v2 oder später."
