PLG_SYSTEM_SGCACHE_VARY_USER_AGENT_DESC="Fügt den Vary: User-Agent Header hinzu, um verschiedene gecachete Versionen für mobile und Desktop-Browser bereitzustellen."
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN="Cache für angemeldete Benutzer"
PLG_SYSTEM_SGCACHE_CACHE_LOGGED_IN_DESC="Caching für angemeldete Benutzer erlauben. WARNUNG: Kann Benutzern falsche Inhalte anzeigen. Nur aktivieren, wenn Ihre Website allen Benutzern denselben Inhalt anzeigt."
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE="Sitzungscookie auf cachefähigen Seiten unterdrücken"
PLG_SYSTEM_SGCACHE_SUPPRESS_SESSION_COOKIE_DESC="Entfernt Joomlas Set-Cookie-Antwortheader bei cachefähigen anonymen GET-Requests, damit der Edge-Cache von SiteGround sie tatsächlich cachen kann. Ohne diese Option überspringt SiteGround wegen des Sitzungscookies das Caching jedes Gastaufrufs (X-Proxy-Cache-Info: SKIP_CACHE_SET_COOKIE). Ausgeschlossene URLs und Komponenten bleiben unberührt und erhalten weiterhin vollständige Sitzungen für Formulare/CSRF. Lassen Sie die Option AN, außer ein Drittanbieter-Plugin muss auf cachefähigen anonymen Seiten Cookies setzen."
PLG_SYSTEM_SGCACHE_PURGE_BUTTON="Manuelles Cache-Leeren"
PLG_SYSTEM_SGCACHE_PURGE_BUTTON_DESC="Klicken Sie, um den gesamten SiteGround Cache manuell zu leeren."

