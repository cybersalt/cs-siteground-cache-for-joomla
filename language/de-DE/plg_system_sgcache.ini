; Cache settings
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE="Dynamischen Cache aktivieren"
PLG_SYSTEM_SGCACHE_ENABLE_DYNAMIC_CACHE_DESC="Aktiviert die dynamischen Cache-Header von SiteGround. Seiten werden als cachefähig für den Reverse Proxy von SiteGround markiert."
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH="Automatisches Leeren bei Inhaltsänderung"
PLG_SYSTEM_SGCACHE_ENABLE_AUTOFLUSH_DESC="Automatisch zugehörige Cache-Einträge leeren, wenn Inhalte gespeichert, gelöscht oder der Status geändert wird."
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD="Löschschwelle"
PLG_SYSTEM_SGCACHE_PURGE_THRESHOLD_DESC="Wenn mehr als diese Anzahl an URL's gelöscht werden müssen, wird statt einzelner Löschung ein vollständiger Cache-Flush durchgeführt. Standard: 10."
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS="Ausgeschlossene URL's"
PLG_SYSTEM_SGCACHE_EXCLUDED_URLS_DESC="Ein URL-Pfad pro Zeile (relativ zum Site-Root), der nie gecachet werden soll. Ein einfacher Pfad gilt auch für alles, was damit beginnt: <code>/members</code> umfasst <code>/members/profile</code>. Verwenden Sie <code>*</code> für beliebigen Text (<code>/shop/*/checkout</code>), beenden Sie eine Zeile mit <code>$</code>, damit nur genau dieser Pfad passt (<code>/about$</code>), und fügen Sie <code>?</code> ein, damit auch der Query-String berücksichtigt wird (<code>/search?q=</code>)."
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS="Ausgeschlossene Menüeinträge"
PLG_SYSTEM_SGCACHE_EXCLUDED_MENU_ITEMS_DESC="Seiten, die unter diesen Menüeinträgen angezeigt werden, werden nie gecachet. Einfacher, als URL-Pfade zu erraten. Joomla verwendet einen Menüeintrag auch für Seiten, die darüber erreicht werden, etwa die Beiträge eines Kategorie-Blogs."
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS="Cachefähige Query-Parameter"
PLG_SYSTEM_SGCACHE_CACHEABLE_QUERY_PARAMS_DESC="Seiten mit einem Query-String werden nicht gecachet, außer bei Marketing-Tracking-Parametern (<code>utm_*</code>, <code>fbclid</code>, <code>gclid</code>...), die die Seite nicht verändern. Tragen Sie hier weitere Parameter ein, einen pro Zeile, damit auch diese Seiten gecachet werden können, zum Beispiel <code>start</code> oder <code>limitstart</code> für die Seitennummerierung. <code>format</code>, <code>tmpl</code> und <code>task</code> werden nie gecachet, ebenso wenig eine Seite, deren URL einen eingetragenen Parameter mit einem Tracking-Parameter mischt: SiteGround würde sie unter dem reinen Pfad speichern."
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS="Ausgeschlossene User Agents"
PLG_SYSTEM_SGCACHE_EXCLUDED_USER_AGENTS_DESC="Ein Textstück pro Zeile, zum Beispiel <code>Feedly</code> oder <code>UptimeRobot</code>. Wenn der User Agent eines Besuchers diesen Text enthält (Groß-/Kleinschreibung egal), wird die für ihn erzeugte Seite nicht im Cache gespeichert. Hinweis: SiteGround kann ihm trotzdem eine für jemand anderen gecachete Kopie ausliefern, sofern <em>Nach User Agent variieren</em> nicht aktiviert ist (Registerkarte Erweiterte Einstellungen)."
PLG_SYSTEM_SGCACHE_FORMS_NOTE_LABEL="Seiten mit Formularen"
PLG_SYSTEM_SGCACHE_FORMS_NOTE="Ein Joomla-Formular enthält ein Sicherheitstoken, das zur Sitzung des Besuchers gehört, daher kann eine gecachete Kopie nicht einfach geteilt werden. Ist <em>Seiten mit Formularen cachen</em> aktiviert, cachet das Plugin die Seite ohne das Token, und der Browser des Besuchers holt sich beim ersten Benutzen des Formulars sein eigenes Token. Formulare, die unten nicht angehakt sind, und Formulare, die das Plugin nicht erkennt, lassen ihre Seite wie bisher ungecachet."
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES="Seiten mit Formularen cachen"
PLG_SYSTEM_SGCACHE_CACHE_FORM_PAGES_DESC="Seiten cachen, deren einzige Formulare zu den unten angehakten Arten gehören; das Token jedes Besuchers wird per Skript geholt. Erfordert JavaScript im Browser des Besuchers (Convert Forms braucht es ohnehin). Senden Sie nach dem Aktivieren jedes Formular einmal in einem privaten Fenster ab, um es zu prüfen. Deaktivieren Sie die Option, damit jede Seite mit einem Formular ungecachet bleibt."
PLG_SYSTEM_SGCACHE_FORM_TYPES="Formulare, die gecachet werden dürfen"
PLG_SYSTEM_SGCACHE_FORM_TYPES_DESC="Formulartypen, die bekanntermaßen außer dem Token nichts aus der Sitzung des Besuchers benötigen."
PLG_SYSTEM_SGCACHE_FORM_TYPE_CONVERTFORMS="Convert Forms"
PLG_SYSTEM_SGCACHE_FORM_TYPE_RSFORM="RSForm! Pro"
PLG_SYSTEM_SGCACHE_FORM_TYPE_LOGIN="Joomla-Anmeldemodul"
PLG_SYSTEM_SGCACHE_FORM_MARKERS="Andere Formulare (Marker)"
PLG_SYSTEM_SGCACHE_FORM_MARKERS_DESC="Für andere Formulare, die nur das Token brauchen: ein Textstück pro Zeile, das im HTML des Formulars vorkommt, etwa <code>id=&quot;newsletter&quot;</code>. Fügen Sie ein Formular erst hinzu, nachdem Sie geprüft haben, dass es nichts anderes in der Sitzung des Besuchers speichert (eine Captcha-Antwort, einen Warenkorb, einen mehrstufigen Zustand)."
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS="Ausgeschlossene Komponenten"
PLG_SYSTEM_SGCACHE_EXCLUDED_COMPONENTS_DESC="Wählen Sie Komponenten aus, deren Seiten niemals von SiteGround gecachet werden sollen."

; Toolbar button settings
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON="Lösch-Schaltfläche im Adminbereich anzeigen"
PLG_SYSTEM_SGCACHE_SHOW_TOOLBAR_BUTTON_DESC="Zeigt eine Schaltfläche 'SiteGround-Cache leeren' in der oberen Leiste des Joomla-Administrationsbereichs an, sichtbar auf jeder Seite. Sie leert nur den Server-Cache von SiteGround. Joomlas eigenes System &rarr; Cache leeren und die Cache-Leeren-Schaltflächen von Optimierern wie JCH Optimize berühren den SiteGround-Cache nicht, und diese Schaltfläche berührt deren Cache nicht."
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE="Schaltflächenmodus"
PLG_SYSTEM_SGCACHE_TOOLBAR_BUTTON_MODE_DESC="Einfach: eine Schaltfläche, die den gesamten Cache leert. Dropdown: eine geteilte Schaltfläche mit 'Alles leeren' plus benutzerdefinierte Pfadoptionen."
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_ALL="Einfach - Alles leeren"
PLG_SYSTEM_SGCACHE_TOOLBAR_MODE_DROPDOWN="Dropdown - Alles leeren + Benutzerdefinierte Pfade"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS="Benutzerdefinierte Löschpfade"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_DESC="Ein Eintrag pro Zeile im Format: Label|/pfad. Diese erscheinen als Optionen im Dropdown. Beispiel: Blog|/blog oder Nachrichtenbereich|/nachrichten"

; Toolbar button labels
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE="SiteGround-Cache leeren"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_TITLE="Leert den Server-Cache von SiteGround (nicht den Joomla-eigenen Cache)"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_ALL="Gesamten Cache leeren"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGE_PATHS_LABEL="Bestimmten Pfad leeren"
PLG_SYSTEM_SGCACHE_TOOLBAR_PURGING="Wird geleert..."

; Logging & debug settings
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING="Dateiprotokollierung aktivieren"
PLG_SYSTEM_SGCACHE_ENABLE_LOGGING_DESC="Schreibt Cache-Vorgänge in eine Protokolldatei im Joomla-Protokollverzeichnis. Nützlich zur Fehlerbehebung. Deaktivieren Sie dies in der Produktion für beste Leistung."
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING="Ausführlicher Modus"
PLG_SYSTEM_SGCACHE_VERBOSE_LOGGING_DESC="Protokolliert jeden Frontend-Seitenaufruf einschließlich cache-aktivierter Antworten. Wenn deaktiviert, werden nur Cache-Umgehungen, Löschvorgänge, Fehler und Inhaltsänderungen protokolliert. Vorübergehend zur Fehlerbehebung aktivieren, dann für die Produktion deaktivieren."
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG="Debug-Panel aktivieren"
PLG_SYSTEM_SGCACHE_ENABLE_DEBUG_DESC="Zeigt ein Debug-Panel am unteren Rand jeder Administrationsseite an, das Cache-Vorgänge des aktuellen Requests anzeigt. Nur für Administratoren sichtbar."
PLG_SYSTEM_SGCACHE_LOG_FILE="Protokolldateiname"
PLG_SYSTEM_SGCACHE_LOG_FILE_DESC="Name der Protokolldatei. Sie wird unter diesem Namen plus .php im Log-Verzeichnis von Joomla gespeichert (Globale Konfiguration &rarr; System &rarr; Pfad zum Log-Verzeichnis) und beginnt mit einer Zeile, die verhindert, dass ein Browser sie liest. Standard: sgcache.log"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE="Maximale Protokollgröße (MB)"
PLG_SYSTEM_SGCACHE_MAX_LOG_SIZE_DESC="Wenn die Protokolldatei diese Größe überschreitet, wird sie rotiert. Behält die letzten 5 rotierten Dateien. Standard: 5 MB."
PLG_SYSTEM_SGCACHE_LOG_VIEWER="Protokollanzeige"
PLG_SYSTEM_SGCACHE_LOG_VIEWER_DESC="Cache-Protokoll anzeigen, herunterladen, testen oder löschen."

