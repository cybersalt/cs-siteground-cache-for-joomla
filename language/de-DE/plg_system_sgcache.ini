; Home page watchdog (System > Scheduled Tasks)
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE_LABEL="Startseiten-Wächter"
PLG_SYSTEM_SGCACHE_WATCHDOG_NOTE="Eine geplante Aufgabe kann Ihre Startseite alle paar Minuten abrufen und, falls sie einmal als etwas anderes als eine Webseite zurückkommt, den SiteGround-Cache leeren und Ihnen eine E-Mail senden. Das Installationsprogramm legt sie unveröffentlicht an: Gehen Sie zu <a href='index.php?option=com_scheduler&amp;view=tasks'>System &rarr; Geplante Aufgaben</a>, öffnen Sie <em>SiteGround Cache: Startseiten-Wächter</em> und veröffentlichen Sie sie."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_TITLE="SiteGround Cache: Startseiten-Wächter"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_DESC="Ruft die Startseite (und eventuelle zusätzliche Pfade) als Besucher ab. Kommt eine davon als etwas anderes als eine HTML-Seite zurück, wird der SiteGround-Cache geleert, erneut geprüft und ein Bericht per E-Mail gesendet."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_SITE_URL_LABEL="Website-Adresse"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_SITE_URL_DESC="Die Adresse der Startseite, zum Beispiel https://www.example.com/. Wird automatisch ausgefüllt; sie wird benötigt, weil eine über die Kommandozeile (cli/joomla.php) ausgeführte Aufgabe die Adresse der Website nicht selbst ermitteln kann."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_NOTIFY_EMAIL_LABEL="Berichte per E-Mail an"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_NOTIFY_EMAIL_DESC="Leer lassen, um die Absenderadresse der Website zu verwenden (Globale Konfiguration &rarr; Server &rarr; Mail)."
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_EXTRA_PATHS_LABEL="Auch diese Pfade prüfen"
PLG_SYSTEM_SGCACHE_TASK_WATCHDOG_EXTRA_PATHS_DESC="Ein Pfad pro Zeile, beginnend mit /, zum Beispiel /blog. Die Startseite wird immer geprüft."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_SUBJECT="%s: SiteGround-Cache hat eine fehlerhafte Seite ausgeliefert"
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_INTRO="Der SiteGround-Cache-Wächter auf %1$s (%2$s) hat diese Seiten als Besucher abgerufen, und sie kamen nicht als normale Webseiten zurück:"
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_PURGED="Der SiteGround-Cache wurde geleert."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_PURGE_FAILED="Das Leeren des SiteGround-Caches ist fehlgeschlagen. Verwenden Sie die Schaltfläche SiteGround-Cache leeren im Joomla-Adminbereich."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_FIXED="Nach dem Leeren kam jede Seite normal zurück."
PLG_SYSTEM_SGCACHE_WATCHDOG_MAIL_STILL="Nach dem Leeren kamen diese weiterhin fehlerhaft zurück: %s. Prüfen Sie die Website."
